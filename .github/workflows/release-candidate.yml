            --controller-identity="$RUNNER_TEMP/candidate/controller-identity.json" \
            --controller-notarization-status=accepted_stapled \
            --controller-notary-submission="$controller_submission_id" \
            --controller-notarytool-evidence="$RUNNER_TEMP/candidate/controller-notarytool-result.json" \
            --controller-stapler-evidence="$RUNNER_TEMP/candidate/controller-stapler-result.txt" \
            "$package" "$RUNNER_TEMP/candidate/AgentPass-${AGENTPASS_RELEASE_TAG}.spdx.json" \
            "$RUNNER_TEMP/candidate/AgentPass-${AGENTPASS_RELEASE_TAG}.database-migration-manifest.json" \
            "$RUNNER_TEMP/candidate/release-attestation.json" \
            "$RUNNER_TEMP/candidate/release-manifest.public.pem" \
            "$RUNNER_TEMP/candidate/AgentPassQualificationController-${AGENTPASS_RELEASE_TAG#v}-macos-universal.tar"
          node scripts/release/sign-manifest.mjs "$RUNNER_TEMP/candidate/AgentPass-${AGENTPASS_RELEASE_TAG}.release-manifest.json" "$RUNNER_TEMP/agentpass-signing/release-manifest.private.pem" "$RUNNER_TEMP/candidate/AgentPass-${AGENTPASS_RELEASE_TAG}.release-manifest.sig"
          node scripts/release/verify-release.mjs "$RUNNER_TEMP/candidate/AgentPass-${AGENTPASS_RELEASE_TAG}.release-manifest.json" "$RUNNER_TEMP/candidate/AgentPass-${AGENTPASS_RELEASE_TAG}.release-manifest.sig" "$RUNNER_TEMP/candidate/release-manifest.public.pem" "$AGENTPASS_RELEASE_MANIFEST_KEY_FINGERPRINT"
      - name: Inventory exact post-staple installer artifact
        env:
          PACKAGE: ${{ runner.temp }}/candidate/AgentPass-${{ needs.verify-source.outputs.tag }}-macos-universal.pkg
          INVENTORY: ${{ runner.temp }}/distribution-input/artifact-inventory.json
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 -p "$RUNNER_TEMP/distribution-input" "$RUNNER_TEMP/distribution-evidence"
          node native/macos/scripts/generate-artifact-inventory.mjs \
            "$RUNNER_TEMP/candidate" "$PACKAGE" "$INVENTORY"
      - name: Independently verify and canonicalize macOS distribution command evidence
        env:
          PACKAGE: ${{ runner.temp }}/candidate/AgentPass-${{ needs.verify-source.outputs.tag }}-macos-universal.pkg
          APP: ${{ runner.temp }}/candidate/AgentPass.app
          NOTARY_RAW: ${{ runner.temp }}/candidate/notarytool-result.json
          STAPLE_RAW: ${{ runner.temp }}/distribution-input/stapler-command.txt
          GATEKEEPER_RAW: ${{ runner.temp }}/distribution-input/gatekeeper-command.txt
          CODESIGN_RAW: ${{ runner.temp }}/distribution-input/codesign-command.txt
          SIGNATURE_RAW: ${{ runner.temp }}/distribution-input/pkgutil-signature.txt
          NOTARY_INPUT: ${{ runner.temp }}/distribution-input/notary.json
          STAPLE_INPUT: ${{ runner.temp }}/distribution-input/staple.json
          GATEKEEPER_INPUT: ${{ runner.temp }}/distribution-input/gatekeeper.json
          IDENTITY_INPUT: ${{ runner.temp }}/distribution-input/identity.json
          VERIFICATION: ${{ runner.temp }}/distribution-input/verification.json
          EXPECTED_TEAM_ID: ${{ secrets.AGENTPASS_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          /usr/bin/xcrun stapler validate "$PACKAGE" > "$STAPLE_RAW" 2>&1
          /usr/bin/grep -Eiq 'The validate action worked!' "$STAPLE_RAW"
          /usr/sbin/spctl --assess --type install --verbose=4 "$PACKAGE" > "$GATEKEEPER_RAW" 2>&1
          /usr/sbin/pkgutil --check-signature "$PACKAGE" > "$SIGNATURE_RAW" 2>&1
          /usr/bin/codesign --verify --strict --verbose=4 "$APP" > "$CODESIGN_RAW" 2>&1
          node --input-type=module - "$PACKAGE" "$NOTARY_RAW" "$STAPLE_RAW" "$GATEKEEPER_RAW" "$SIGNATURE_RAW" "$CODESIGN_RAW" "$NOTARY_INPUT" "$STAPLE_INPUT" "$GATEKEEPER_INPUT" "$IDENTITY_INPUT" "$VERIFICATION" "$EXPECTED_TEAM_ID" <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';

          const [artifact, notaryRawPath, stapleRawPath, gatekeeperRawPath, signatureRawPath, codesignRawPath, notaryPath, staplePath, gatekeeperPath, identityPath, verificationPath, expectedTeam] = process.argv.slice(2);
          const digest = createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          const writeOnce = (output, value) => {
            const fd = fs.openSync(output, fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW, 0o600);
            try { fs.writeFileSync(fd, `${JSON.stringify(value, null, 2)}\n`, 'utf8'); fs.fsyncSync(fd); } finally { fs.closeSync(fd); }
          };
          const notary = JSON.parse(fs.readFileSync(notaryRawPath, 'utf8'));
          if (notary.status !== 'Accepted' || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu.test(String(notary.id ?? ''))) throw new Error('notarytool result is not an accepted UUID submission');
          if (!fs.readFileSync(stapleRawPath, 'utf8').trim() || !fs.readFileSync(gatekeeperRawPath, 'utf8').trim() || !fs.readFileSync(codesignRawPath, 'utf8').trim()) throw new Error('macOS verification command output is empty');
          const signatureOutput = fs.readFileSync(signatureRawPath, 'utf8');
          if (!/Status: signed by a certificate trusted by Mac OS X/u.test(signatureOutput)) throw new Error('pkgutil did not prove a trusted package signature');
          const match = signatureOutput.match(/Developer ID Installer:[^\r\n]+\(([A-Z0-9]{10})\)/u);
          if (!match || match[1] !== expectedTeam) throw new Error('pkgutil Developer ID Installer identity is not bound to the expected Team ID');
          const identity = match[0];
          writeOnce(notaryPath, { status: 'Accepted', id: String(notary.id) });
          writeOnce(staplePath, { status: 'validated', artifact_sha256: digest });
          writeOnce(gatekeeperPath, { assessment: 'accepted', artifact_sha256: digest });
          writeOnce(identityPath, { format: 'Developer ID Installer', identity, team_id: expectedTeam, verified: true });
          writeOnce(verificationPath, { schema_version: 1, kind: 'agentpass.macos-distribution-verification-v1', status: 'verified', artifact_sha256: digest, signature_verified: true, notarization_verified: true, staple_verified: true, gatekeeper_verified: true });
          NODE
      - name: Produce canonical independent macOS distribution evidence
        env:
          PACKAGE: ${{ runner.temp }}/candidate/AgentPass-${{ needs.verify-source.outputs.tag }}-macos-universal.pkg
          INVENTORY: ${{ runner.temp }}/distribution-input/artifact-inventory.json
          EVIDENCE_ROOT: ${{ runner.temp }}/distribution-evidence
          NOTARY_INPUT: ${{ runner.temp }}/distribution-input/notary.json
          STAPLE_INPUT: ${{ runner.temp }}/distribution-input/staple.json
          GATEKEEPER_INPUT: ${{ runner.temp }}/distribution-input/gatekeeper.json
          IDENTITY_INPUT: ${{ runner.temp }}/distribution-input/identity.json
          VERIFICATION: ${{ runner.temp }}/distribution-input/verification.json
          EVIDENCE: ${{ runner.temp }}/distribution-evidence/distribution-evidence.json
        run: |
          set -euo pipefail
          node scripts/ops/create-macos-distribution-evidence.mjs \
            "$PACKAGE" "$INVENTORY" "$EVIDENCE_ROOT" "$NOTARY_INPUT" "$STAPLE_INPUT" "$GATEKEEPER_INPUT" \

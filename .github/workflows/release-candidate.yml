          SOURCE_TREE: ${{ needs.verify-source.outputs.tree }}
          RELEASE_TAG: ${{ needs.verify-source.outputs.tag }}
        run: |
          set -euo pipefail
          artifact_sha256="$(shasum -a 256 "$PACKAGE" | awk '{print $1}')"
          jobs_json="$RUNNER_TEMP/distribution-input/verification-jobs.json"
          gh api --method GET -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$jobs_json"
          verification_job_id="$(node --input-type=module - "$GITHUB_JOB" "$jobs_json" <<'NODE'
          import fs from 'node:fs';
          const [jobName, jobsPath] = process.argv.slice(2);
          const jobs = JSON.parse(fs.readFileSync(jobsPath, 'utf8')).jobs;
          const matches = jobs.filter((job) => job.name === jobName && job.runner_name);
          if (matches.length !== 1 || !Number.isSafeInteger(matches[0].id)) throw new Error('current GitHub verification job identity is ambiguous');
          process.stdout.write(String(matches[0].id));
          NODE
          )"
          runner_name="${RUNNER_NAME:-unknown}"
          runner_id="github-actions/$(printf '%s' "$runner_name" | sed 's/[^A-Za-z0-9._:\/-]/_/g')"
          node scripts/ops/create-macos-distribution-provenance.mjs \
            "$artifact_sha256" "$SOURCE_COMMIT" "$SOURCE_TREE" "$GITHUB_REPOSITORY" "$RELEASE_TAG" \
            "$CI_RUN_ID" "$CI_RUN_ATTEMPT" "$GITHUB_RUN_ID" "$verification_job_id" "$runner_id" "$PROVENANCE"
          rm -f "$jobs_json"
      - name: Require source-bound external qualification evidence inputs
        env:
          AGENTPASS_KMS_QUALIFICATION_EVIDENCE_JSON: ${{ secrets.AGENTPASS_KMS_QUALIFICATION_EVIDENCE_JSON }}
          AGENTPASS_PLATFORM_AUTH_QUALIFICATION_EVIDENCE_JSON: ${{ secrets.AGENTPASS_PLATFORM_AUTH_QUALIFICATION_EVIDENCE_JSON }}
          AGENTPASS_KMS_QUALIFICATION_DEPLOYMENT_DIGEST: ${{ vars.AGENTPASS_KMS_QUALIFICATION_DEPLOYMENT_DIGEST }}
          AGENTPASS_KMS_QUALIFICATION_RUN_ID: ${{ vars.AGENTPASS_KMS_QUALIFICATION_RUN_ID }}
          AGENTPASS_KMS_QUALIFICATION_JOB_ID: ${{ vars.AGENTPASS_KMS_QUALIFICATION_JOB_ID }}
          AGENTPASS_PLATFORM_AUTH_QUALIFICATION_PRIMARY_DEPLOYMENT_DIGEST: ${{ vars.AGENTPASS_PLATFORM_AUTH_QUALIFICATION_PRIMARY_DEPLOYMENT_DIGEST }}
          AGENTPASS_PLATFORM_AUTH_QUALIFICATION_SECONDARY_DEPLOYMENT_DIGEST: ${{ vars.AGENTPASS_PLATFORM_AUTH_QUALIFICATION_SECONDARY_DEPLOYMENT_DIGEST }}
          AGENTPASS_PLATFORM_AUTH_QUALIFICATION_RUN_ID: ${{ vars.AGENTPASS_PLATFORM_AUTH_QUALIFICATION_RUN_ID }}
          AGENTPASS_PLATFORM_AUTH_QUALIFICATION_JOB_ID: ${{ vars.AGENTPASS_PLATFORM_AUTH_QUALIFICATION_JOB_ID }}
          MANIFEST: ${{ runner.temp }}/candidate/AgentPass-${{ needs.verify-source.outputs.tag }}.release-manifest.json
          EXPECTED_TREE: ${{ needs.verify-source.outputs.tree }}
        run: |

      - name: Bind macOS distribution evidence to exact workflow provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE: ${{ runner.temp }}/distribution-input/provenance.json
          PACKAGE: ${{ runner.temp }}/candidate/AgentPass-${{ needs.verify-source.outputs.tag }}-macos-universal.pkg
          CI_RUN_ID: ${{ needs.verify-source.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.verify-source.outputs.ci_run_attempt }}

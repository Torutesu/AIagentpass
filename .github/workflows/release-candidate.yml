name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated vX.Y.Z tag to build
        required: true
        type: string
      ci_run_id:
        description: Successful CI workflow run ID with all six protected lanes green on the tag commit
        required: true
        type: string
      ci_run_attempt:
        description: Exact attempt of the selected canonical CI workflow run
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify-source:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Torutesu/AIagentpass' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      tree: ${{ steps.verify.outputs.tree }}
      tag: ${{ steps.verify.outputs.tag }}
      ci_run_id: ${{ steps.verify.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.verify.outputs.ci_run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: verify
        name: Verify SSH-signed release tag without production secrets
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          ALLOWED_SIGNERS: ${{ vars.AGENTPASS_RELEASE_ALLOWED_SIGNERS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          [[ -n "$ALLOWED_SIGNERS" ]] || { echo "AGENTPASS_RELEASE_ALLOWED_SIGNERS is not configured" >&2; exit 1; }
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]] || { echo "ci_run_id must be a decimal run ID" >&2; exit 1; }
          [[ "$CI_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]] || { echo "ci_run_attempt must be an exact attempt" >&2; exit 1; }
          allowed_signers="$RUNNER_TEMP/agentpass-release.allowed-signers"
          umask 077
          printf '%s\n' "$ALLOWED_SIGNERS" > "$allowed_signers"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git cat-file -t "$RELEASE_TAG")" == tag ]] || { echo "Release tag must be annotated" >&2; exit 1; }
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$allowed_signers" verify-tag "$RELEASE_TAG"
          commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          tree="$(git rev-parse "$RELEASE_TAG^{tree}")"
          git merge-base --is-ancestor "$commit" origin/main
          [[ "$(git show "$commit:package.json" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>process.stdout.write(`v${JSON.parse(s).version}`))')" == "$RELEASE_TAG" ]] || { echo "Tag and package version disagree" >&2; exit 1; }
          ci_run="$RUNNER_TEMP/agentpass-ci-run.json"
          ci_jobs="$RUNNER_TEMP/agentpass-ci-jobs.json"
          gh api --method GET -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/runs/$CI_RUN_ID" > "$ci_run"
          gh api --method GET -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/runs/$CI_RUN_ID/jobs?per_page=100" > "$ci_jobs"
          ci_commit="$RUNNER_TEMP/agentpass-ci-commit.json"
          gh api --method GET -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/git/commits/$commit" > "$ci_commit"
          node --input-type=module - "$ci_run" "$ci_jobs" "$ci_commit" "$commit" "$tree" "$GITHUB_REPOSITORY" "$CI_RUN_ID" <<'NODE'
          import fs from 'node:fs';
          import { assertGithubCiRun, assertGithubCommit } from './scripts/release/ci-preflight.mjs';
          const [runPath, jobsPath, commitPath, expectedCommit, expectedTree, repository, expectedRunId] = process.argv.slice(2);
          const run = JSON.parse(fs.readFileSync(runPath, 'utf8'));
          const jobsEnvelope = JSON.parse(fs.readFileSync(jobsPath, 'utf8'));
          if (!Number.isSafeInteger(jobsEnvelope.total_count)) throw new Error('GitHub CI jobs response must include an exact total_count');
          assertGithubCiRun(run, jobsEnvelope.jobs, { expectedSha: expectedCommit, repository, expectedRunId, expectedRunAttempt: process.env.CI_RUN_ATTEMPT, jobsTotalCount: jobsEnvelope.total_count });
          const commit = assertGithubCommit(JSON.parse(fs.readFileSync(commitPath, 'utf8')), { repository, expectedSha: expectedCommit });
          if (commit.tree_sha !== expectedTree) throw new Error('GitHub commit API tree differs from the signed tag tree');
          NODE
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ci_run_attempt=$CI_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  signed-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Torutesu/AIagentpass' && github.ref == 'refs/heads/main' }}
    needs: verify-source
    runs-on: macos-15
    environment: production-signing
    env:
      AGENTPASS_RELEASE_TAG: ${{ needs.verify-source.outputs.tag }}
      AGENTPASS_RELEASE_COMMIT: ${{ needs.verify-source.outputs.commit }}
      AGENTPASS_RELEASE_TREE: ${{ needs.verify-source.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-source.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: CI release boundary preflight (before protected credentials)
        run: |
          node --input-type=module <<'NODE'
          import { assertGithubCiRun, assertWorkflowBoundary, assertCleanCheckout } from './scripts/release/ci-preflight.mjs';
          assertWorkflowBoundary({ eventName: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF, repository: process.env.GITHUB_REPOSITORY });
          assertCleanCheckout(process.env.GITHUB_WORKSPACE);
          NODE
      - name: Re-validate exact-SHA CI lanes before protected credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.verify-source.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.verify-source.outputs.ci_run_attempt }}
          EXPECTED_COMMIT: ${{ needs.verify-source.outputs.commit }}
          EXPECTED_TREE: ${{ needs.verify-source.outputs.tree }}
        run: |
          set -euo pipefail
          ci_run="$RUNNER_TEMP/agentpass-ci-run.json"
          ci_jobs="$RUNNER_TEMP/agentpass-ci-jobs.json"
          gh api --method GET -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/runs/$CI_RUN_ID" > "$ci_run"
          gh api --method GET -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/runs/$CI_RUN_ID/jobs?per_page=100" > "$ci_jobs"
          ci_commit="$RUNNER_TEMP/agentpass-ci-commit.json"
          gh api --method GET -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/git/commits/$EXPECTED_COMMIT" > "$ci_commit"
          node --input-type=module - "$ci_run" "$ci_jobs" "$ci_commit" "$EXPECTED_COMMIT" "$EXPECTED_TREE" "$GITHUB_REPOSITORY" "$CI_RUN_ID" <<'NODE'
          import fs from 'node:fs';
          import { assertGithubCiRun, assertGithubCommit } from './scripts/release/ci-preflight.mjs';
          const [runPath, jobsPath, commitPath, expectedCommit, expectedTree, repository, expectedRunId] = process.argv.slice(2);
          const run = JSON.parse(fs.readFileSync(runPath, 'utf8'));
          const jobsEnvelope = JSON.parse(fs.readFileSync(jobsPath, 'utf8'));
          if (!Number.isSafeInteger(jobsEnvelope.total_count)) throw new Error('GitHub CI jobs response must include an exact total_count');
          assertGithubCiRun(run, jobsEnvelope.jobs, { expectedSha: expectedCommit, repository, expectedRunId, expectedRunAttempt: process.env.CI_RUN_ATTEMPT, jobsTotalCount: jobsEnvelope.total_count });
          const commit = assertGithubCommit(JSON.parse(fs.readFileSync(commitPath, 'utf8')), { repository, expectedSha: expectedCommit });
          if (commit.tree_sha !== expectedTree) throw new Error('GitHub commit API tree differs from the signed tag tree');
          NODE
      - name: Persist exact canonical CI evidence into the signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.verify-source.outputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ needs.verify-source.outputs.ci_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]{0,18}$ || "$CI_RUN_ID" =~ ^[1-9][0-9]{19}$ ]] || { echo "ci_run_id must be a decimal run ID" >&2; exit 1; }
          mkdir -m 0700 -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/agentpass-ci-preflight"
          gh api --method GET -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/agentpass-ci-preflight/run.json"
          gh api --method GET -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/agentpass-ci-preflight/jobs.json"
          gh api --method GET -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/git/commits/$AGENTPASS_RELEASE_COMMIT" > "$RUNNER_TEMP/agentpass-ci-preflight/commit.json"
          node scripts/release/ci-preflight.mjs github-commit \
            "$RUNNER_TEMP/agentpass-ci-preflight/commit.json" "$GITHUB_REPOSITORY" "$AGENTPASS_RELEASE_COMMIT" > "$RUNNER_TEMP/agentpass-ci-preflight/commit-binding.json"
          [[ "$(jq -er '.tree_sha' "$RUNNER_TEMP/agentpass-ci-preflight/commit-binding.json")" == "$AGENTPASS_RELEASE_TREE" ]] || { echo "GitHub commit API tree differs from the signed tag tree" >&2; exit 1; }
          node scripts/release/ci-preflight.mjs github \
            "$RUNNER_TEMP/agentpass-ci-preflight/run.json" \
            "$RUNNER_TEMP/agentpass-ci-preflight/jobs.json" \
            "$AGENTPASS_RELEASE_COMMIT" "$GITHUB_REPOSITORY" "$CI_RUN_ID" "$CI_RUN_ATTEMPT" > "$RUNNER_TEMP/candidate/ci-preflight.json"

      - name: Require protected signing inputs
        env:
          AGENTPASS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.AGENTPASS_SIGNING_CERTIFICATE_P12_BASE64 }}
          AGENTPASS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.AGENTPASS_SIGNING_CERTIFICATE_PASSWORD }}
          AGENTPASS_SIGNING_IDENTITY: ${{ secrets.AGENTPASS_SIGNING_IDENTITY }}
          AGENTPASS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.AGENTPASS_INSTALLER_SIGNING_IDENTITY }}
          AGENTPASS_TEAM_ID: ${{ secrets.AGENTPASS_TEAM_ID }}
          AGENTPASS_APP_IDENTIFIER_PREFIX: ${{ secrets.AGENTPASS_APP_IDENTIFIER_PREFIX }}
          AGENTPASS_SERVICE_PROFILE_BASE64: ${{ secrets.AGENTPASS_SERVICE_PROFILE_BASE64 }}
          AGENTPASS_CLIENT_PROFILE_BASE64: ${{ secrets.AGENTPASS_CLIENT_PROFILE_BASE64 }}
          AGENTPASS_AGENT_PROFILE_BASE64: ${{ secrets.AGENTPASS_AGENT_PROFILE_BASE64 }}
          AGENTPASS_QUALIFICATION_CLIENT_PROFILE_BASE64: ${{ secrets.AGENTPASS_QUALIFICATION_CLIENT_PROFILE_BASE64 }}
          AGENTPASS_CONTROLLER_PROFILE_BASE64: ${{ secrets.AGENTPASS_CONTROLLER_PROFILE_BASE64 }}
          AGENTPASS_EPHEMERAL_KEYCHAIN_PASSWORD: ${{ secrets.AGENTPASS_EPHEMERAL_KEYCHAIN_PASSWORD }}
          AGENTPASS_RELEASE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.AGENTPASS_RELEASE_MANIFEST_PRIVATE_KEY_BASE64 }}
          AGENTPASS_RELEASE_MANIFEST_PUBLIC_KEY_BASE64: ${{ vars.AGENTPASS_RELEASE_MANIFEST_PUBLIC_KEY_BASE64 }}
          AGENTPASS_NOTARY_KEY_ID: ${{ secrets.AGENTPASS_NOTARY_KEY_ID }}
          AGENTPASS_NOTARY_ISSUER_ID: ${{ secrets.AGENTPASS_NOTARY_ISSUER_ID }}
          AGENTPASS_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.AGENTPASS_NOTARY_PRIVATE_KEY_BASE64 }}
        run: scripts/release/require-credentials.sh
      - name: Require dedicated controller profile
        env:
          AGENTPASS_CONTROLLER_PROFILE_BASE64: ${{ secrets.AGENTPASS_CONTROLLER_PROFILE_BASE64 }}
          AGENTPASS_AGENT_PROFILE_BASE64: ${{ secrets.AGENTPASS_AGENT_PROFILE_BASE64 }}
          AGENTPASS_QUALIFICATION_CLIENT_PROFILE_BASE64: ${{ secrets.AGENTPASS_QUALIFICATION_CLIENT_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${AGENTPASS_CONTROLLER_PROFILE_BASE64:?AGENTPASS_CONTROLLER_PROFILE_BASE64 is required}"
          : "${AGENTPASS_AGENT_PROFILE_BASE64:?AGENTPASS_AGENT_PROFILE_BASE64 is required}"
          : "${AGENTPASS_QUALIFICATION_CLIENT_PROFILE_BASE64:?AGENTPASS_QUALIFICATION_CLIENT_PROFILE_BASE64 is required}"
      - run: npm ci
      - name: Validate frozen protocol and schema catalog before signing
        run: |
          npm run contracts:validate
          node --test test/contract-catalog.test.mjs
      - name: Validate Cursor Agent runtime manifest and materializer contract
        run: npm run test:cursor-runtime
      - run: node scripts/release/validate-version.mjs --require-tag --tag="$AGENTPASS_RELEASE_TAG"
      - name: Generate immutable database migration manifest
        run: |
          set -euo pipefail
          migration_manifest="$RUNNER_TEMP/candidate/AgentPass-${AGENTPASS_RELEASE_TAG}.database-migration-manifest.json"
          mkdir -p "$RUNNER_TEMP/candidate"
          node scripts/release/generate-database-migration-manifest.mjs \
            --repository-root "$GITHUB_WORKSPACE" \
            --commit "$AGENTPASS_RELEASE_COMMIT" \
            --output "$migration_manifest"
      - name: Import ephemeral signing material
        env:
          AGENTPASS_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.AGENTPASS_SIGNING_CERTIFICATE_P12_BASE64 }}
          AGENTPASS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.AGENTPASS_SIGNING_CERTIFICATE_PASSWORD }}
          AGENTPASS_SERVICE_PROFILE_BASE64: ${{ secrets.AGENTPASS_SERVICE_PROFILE_BASE64 }}
          AGENTPASS_CLIENT_PROFILE_BASE64: ${{ secrets.AGENTPASS_CLIENT_PROFILE_BASE64 }}
          AGENTPASS_AGENT_PROFILE_BASE64: ${{ secrets.AGENTPASS_AGENT_PROFILE_BASE64 }}
          AGENTPASS_QUALIFICATION_CLIENT_PROFILE_BASE64: ${{ secrets.AGENTPASS_QUALIFICATION_CLIENT_PROFILE_BASE64 }}
          AGENTPASS_CONTROLLER_PROFILE_BASE64: ${{ secrets.AGENTPASS_CONTROLLER_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.AGENTPASS_EPHEMERAL_KEYCHAIN_PASSWORD }}
          RELEASE_MANIFEST_PRIVATE_KEY: ${{ secrets.AGENTPASS_RELEASE_MANIFEST_PRIVATE_KEY_BASE64 }}
          RELEASE_MANIFEST_PUBLIC_KEY: ${{ vars.AGENTPASS_RELEASE_MANIFEST_PUBLIC_KEY_BASE64 }}
          NOTARY_PRIVATE_KEY: ${{ secrets.AGENTPASS_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${KEYCHAIN_PASSWORD:?AGENTPASS_EPHEMERAL_KEYCHAIN_PASSWORD is required}"
          umask 077
          mkdir -p "$RUNNER_TEMP/agentpass-signing"
          printf '%s' "$AGENTPASS_SIGNING_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/agentpass-signing/certificate.p12"
          printf '%s' "$AGENTPASS_SERVICE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/agentpass-signing/service.provisionprofile"
          printf '%s' "$AGENTPASS_CLIENT_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/agentpass-signing/client.provisionprofile"
          printf '%s' "$AGENTPASS_AGENT_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/agentpass-signing/agent.provisionprofile"
          printf '%s' "$AGENTPASS_QUALIFICATION_CLIENT_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/agentpass-signing/qualification-client.provisionprofile"
          printf '%s' "$AGENTPASS_CONTROLLER_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/agentpass-signing/controller.provisionprofile"
          [[ -n "$RELEASE_MANIFEST_PUBLIC_KEY" ]] || { echo "Release manifest public key is not configured" >&2; exit 1; }
          printf '%s' "$RELEASE_MANIFEST_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/agentpass-signing/release-manifest.private.pem"
          printf '%s' "$RELEASE_MANIFEST_PUBLIC_KEY" | base64 --decode > "$RUNNER_TEMP/agentpass-signing/release-manifest.public.pem"
          printf '%s' "$NOTARY_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/agentpass-signing/notary-auth-key.p8"
          chmod 0600 "$RUNNER_TEMP/agentpass-signing/notary-auth-key.p8" "$RUNNER_TEMP/agentpass-signing/release-manifest.private.pem"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/agentpass-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/agentpass-signing.keychain-db"
          security import "$RUNNER_TEMP/agentpass-signing/certificate.p12" -k "$RUNNER_TEMP/agentpass-signing.keychain-db" -P "$AGENTPASS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/agentpass-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/agentpass-signing.keychain-db"
      - name: Materialize protected attestation inputs
        env:
          AGENTPASS_CLOUD_IMAGE_DIGEST: ${{ vars.AGENTPASS_CLOUD_IMAGE_DIGEST }}
          AGENTPASS_SIGNER_KEY_VERSIONS_JSON: ${{ secrets.AGENTPASS_SIGNER_KEY_VERSIONS_JSON }}
        run: |
          set -euo pipefail
          : "${AGENTPASS_CLOUD_IMAGE_DIGEST:?AGENTPASS_CLOUD_IMAGE_DIGEST is required}"
          : "${AGENTPASS_SIGNER_KEY_VERSIONS_JSON:?AGENTPASS_SIGNER_KEY_VERSIONS_JSON is required}"
          umask 077
          input_dir="$RUNNER_TEMP/agentpass-attestation-inputs"
          mkdir -m 0700 -p "$input_dir"
          node --input-type=module - "$input_dir/signer-key-versions.json" <<'NODE'
          import fs from "node:fs";
          import process from "node:process";

          const output = process.argv[2];
          const input = process.env.AGENTPASS_SIGNER_KEY_VERSIONS_JSON;
          if (!output || typeof input !== "string" || input.length === 0) throw new Error("protected signer key versions input is missing");
          let value;
          try { value = JSON.parse(input); } catch { throw new Error("protected signer key versions input is not valid JSON"); }
          if (!Array.isArray(value) || value.length === 0 || value.length > 64) throw new Error("protected signer key versions input must be a non-empty array");
          const names = new Set();
          let previous = "";
          for (const item of value) {
            if (!item || typeof item !== "object" || Array.isArray(item) || Object.keys(item).sort().join(",") !== "name,version") throw new Error("protected signer key versions contain an invalid entry");
            if (!/^[A-Za-z0-9._-]{1,80}$/.test(item.name) || !/^[A-Za-z0-9][A-Za-z0-9._+~-]{0,127}$/.test(item.version) || names.has(item.name) || item.name <= previous) throw new Error("protected signer key versions must be unique, sorted, and canonical");
            names.add(item.name);
            previous = item.name;
          }
          const canonical = `${JSON.stringify(value, null, 2)}\n`;
          if (input !== canonical) throw new Error("protected signer key versions must use canonical JSON");
          const flags = fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW;
          const fd = fs.openSync(output, flags, 0o600);
          try {
            fs.writeFileSync(fd, canonical, { encoding: "utf8" });
            fs.fsyncSync(fd);
          } finally {
            fs.closeSync(fd);
          }
          NODE
          [[ "$(stat -f '%Lp' "$input_dir/signer-key-versions.json")" == 600 ]] || { echo "signer key versions file permissions are unsafe" >&2; exit 1; }
      - name: Build, independently notarize, staple, and archive external qualification controller
        env:
          AGENTPASS_SIGNING_IDENTITY: ${{ secrets.AGENTPASS_SIGNING_IDENTITY }}
          AGENTPASS_TEAM_ID: ${{ secrets.AGENTPASS_TEAM_ID }}
          AGENTPASS_APP_IDENTIFIER_PREFIX: ${{ secrets.AGENTPASS_APP_IDENTIFIER_PREFIX }}
          AGENTPASS_AGENT_PROFILE_BASE64: ${{ secrets.AGENTPASS_AGENT_PROFILE_BASE64 }}
          AGENTPASS_NOTARY_KEY_ID: ${{ secrets.AGENTPASS_NOTARY_KEY_ID }}
          AGENTPASS_NOTARY_ISSUER_ID: ${{ secrets.AGENTPASS_NOTARY_ISSUER_ID }}
          AGENTPASS_NOTARY_PRIVATE_KEY_PATH: ${{ runner.temp }}/agentpass-signing/notary-auth-key.p8
        run: |
          set -euo pipefail
          controller_dir="$RUNNER_TEMP/controller"
          controller_build_dir="$controller_dir/build"
          controller_app="$controller_dir/AgentPassQualificationController.app"
          controller_binary="$controller_dir/agentpass-qualification-controller-universal"
          controller_notarytool="$controller_dir/controller-notarytool-result.json"
          controller_stapler="$controller_dir/controller-stapler-result.txt"
          release_version="${AGENTPASS_RELEASE_TAG#v}"
          controller_archive="$controller_dir/AgentPassQualificationController-${release_version}-macos-universal.tar"
          mkdir -m 0700 -p "$controller_build_dir"
          for architecture in arm64 x86_64; do
            MACOSX_DEPLOYMENT_TARGET=14.0 swift build -c release --package-path native/macos --arch "$architecture"
            bin_path="$(MACOSX_DEPLOYMENT_TARGET=14.0 swift build -c release --package-path native/macos --arch "$architecture" --show-bin-path)"
            install -m 0755 "$bin_path/agentpass-qualification-controller" "$controller_build_dir/agentpass-qualification-controller-$architecture"
          done
          xcrun lipo -create \
            "$controller_build_dir/agentpass-qualification-controller-arm64" \
            "$controller_build_dir/agentpass-qualification-controller-x86_64" \
            -output "$controller_binary"
          chmod 0755 "$controller_binary"
          native/macos/Qualification/build-controller.sh \
            --source-binary "$controller_binary" --output "$controller_app" \
            --identity "$AGENTPASS_SIGNING_IDENTITY" --team-id "$AGENTPASS_TEAM_ID" \
            --app-identifier-prefix "$AGENTPASS_APP_IDENTIFIER_PREFIX" \
            --profile "$RUNNER_TEMP/agentpass-signing/controller.provisionprofile"
          scripts/release/notarize-controller.sh "$controller_app" "$controller_notarytool" "$controller_stapler"
          node native/macos/Qualification/archive-controller.mjs "$controller_app" "$controller_archive" "$release_version"
      - name: Collect external qualification controller identity
        env:
          AGENTPASS_TEAM_ID: ${{ secrets.AGENTPASS_TEAM_ID }}
        run: |
          set -euo pipefail
          controller_dir="$RUNNER_TEMP/controller"
          controller_identity="$controller_dir/controller-identity.json"
          controller_identity_cli="scripts/release/n3e/controller-identity-contract.mjs"
          node "$controller_identity_cli" collect \
            "$controller_dir/AgentPassQualificationController-${AGENTPASS_RELEASE_TAG#v}-macos-universal.tar" \
            "$controller_dir/AgentPassQualificationController.app" "$AGENTPASS_TEAM_ID" "$controller_identity"
          test -s "$controller_identity"
      - name: Build, notarize, staple, and bind installer candidate
        env:
          AGENTPASS_SIGNING_IDENTITY: ${{ secrets.AGENTPASS_SIGNING_IDENTITY }}
          AGENTPASS_INSTALLER_SIGNING_IDENTITY: ${{ secrets.AGENTPASS_INSTALLER_SIGNING_IDENTITY }}
          AGENTPASS_TEAM_ID: ${{ secrets.AGENTPASS_TEAM_ID }}
          AGENTPASS_APP_IDENTIFIER_PREFIX: ${{ secrets.AGENTPASS_APP_IDENTIFIER_PREFIX }}
          AGENTPASS_RELEASE_MANIFEST_KEY_FINGERPRINT: ${{ vars.AGENTPASS_RELEASE_MANIFEST_KEY_FINGERPRINT }}
          AGENTPASS_CLOUD_IMAGE_DIGEST: ${{ vars.AGENTPASS_CLOUD_IMAGE_DIGEST }}
          AGENTPASS_NOTARY_KEY_ID: ${{ secrets.AGENTPASS_NOTARY_KEY_ID }}
          AGENTPASS_NOTARY_ISSUER_ID: ${{ secrets.AGENTPASS_NOTARY_ISSUER_ID }}
          AGENTPASS_NOTARY_PRIVATE_KEY_PATH: ${{ runner.temp }}/agentpass-signing/notary-auth-key.p8
        run: |
          set -euo pipefail
          native/macos/scripts/build-app.sh --universal --output-dir "$RUNNER_TEMP/candidate" \

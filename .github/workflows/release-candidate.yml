          node scripts/release/ci-preflight.mjs kms-qualification "$RUNNER_TEMP/integrity-evidence/kms-qualification.json" "$AGENTPASS_RELEASE_COMMIT" "$EXPECTED_TREE" "$AGENTPASS_KMS_QUALIFICATION_DEPLOYMENT_DIGEST" "$product_sha256" "$AGENTPASS_KMS_QUALIFICATION_RUN_ID" "$AGENTPASS_KMS_QUALIFICATION_JOB_ID" >/dev/null
          node scripts/release/ci-preflight.mjs platform-auth-qualification "$RUNNER_TEMP/integrity-evidence/platform-auth-qualification.json" "$AGENTPASS_RELEASE_COMMIT" "$EXPECTED_TREE" "$AGENTPASS_PLATFORM_AUTH_QUALIFICATION_PRIMARY_DEPLOYMENT_DIGEST" "$AGENTPASS_PLATFORM_AUTH_QUALIFICATION_SECONDARY_DEPLOYMENT_DIGEST" "$AGENTPASS_PLATFORM_AUTH_QUALIFICATION_RUN_ID" "$AGENTPASS_PLATFORM_AUTH_QUALIFICATION_JOB_ID" >/dev/null
          node scripts/release/archive-secret-scan.mjs "$RUNNER_TEMP/integrity-evidence/kms-qualification.json" "$RUNNER_TEMP/integrity-evidence/platform-auth-qualification.json" >/dev/null
      - name: CI candidate/source digest preflight
        env:
          MANIFEST: ${{ runner.temp }}/candidate/AgentPass-${{ needs.verify-source.outputs.tag }}.release-manifest.json
          CANDIDATE_ROOT: ${{ runner.temp }}/candidate
        run: |
          node --input-type=module - "$MANIFEST" <<'NODE'
          import { assertCandidateBinding, assertWorkflowBoundary } from './scripts/release/ci-preflight.mjs';
          assertWorkflowBoundary({ eventName: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF, repository: process.env.GITHUB_REPOSITORY });
          assertCandidateBinding({ repoRoot: process.env.GITHUB_WORKSPACE, manifestPath: process.argv[2], expectedCommit: process.env.AGENTPASS_RELEASE_COMMIT, expectedTree: process.env.AGENTPASS_RELEASE_TREE });
          NODE
      - name: Derive immutable release evidence candidate binding
        env:
          MANIFEST: ${{ runner.temp }}/candidate/AgentPass-${{ needs.verify-source.outputs.tag }}.release-manifest.json
          INTEGRITY_DIR: ${{ runner.temp }}/integrity-evidence
          EXPECTED_CANDIDATE: ${{ runner.temp }}/integrity-evidence/release-evidence-expected-candidate.json
          EXPECTED_COMMIT: ${{ needs.verify-source.outputs.commit }}
          EXPECTED_TREE: ${{ needs.verify-source.outputs.tree }}
        run: |
          set -euo pipefail
          mkdir -m 0700 -p "$INTEGRITY_DIR"
          node --input-type=module - "$MANIFEST" "$EXPECTED_CANDIDATE" "$EXPECTED_COMMIT" "$EXPECTED_TREE" <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import { basename } from 'node:path';
          import { canonicalJson } from './packages/protocol/src/index.mjs';
          const [manifestPath, output, expectedCommit, expectedTree] = process.argv.slice(2);
          const manifestBytes = fs.readFileSync(manifestPath);
          const manifest = JSON.parse(manifestBytes);
          const product = manifest.artifacts?.filter((item) => item?.role === 'product');
          if (product?.length !== 1 || product[0].name !== basename(product[0].name) || !/^[0-9a-f]{64}$/u.test(product[0].sha256)) throw new Error('signed release manifest product inventory is incomplete');
          if (manifest.source?.commit !== expectedCommit || manifest.source?.tree !== expectedTree) throw new Error('signed release manifest source binding differs from the verified candidate');
          const packagePath = `${manifestPath.slice(0, manifestPath.lastIndexOf('/'))}/${product[0].name}`;
          const packageBytes = fs.readFileSync(packagePath);
          const artifactSha256 = createHash('sha256').update(packageBytes).digest('hex');
          const manifestSha256 = createHash('sha256').update(manifestBytes).digest('hex');
          if (product[0].sha256 !== artifactSha256) throw new Error('signed release manifest product digest differs from the exact PKG');
          const expected = {
            artifact_name: product[0].name,
            artifact_sha256: artifactSha256,
            candidate_id: manifest.candidate_id,
            release_manifest_sha256: manifestSha256,
            source_commit: expectedCommit,
            source_tree: expectedTree
          };
          if (expected.candidate_id !== `release-pkg-sha256-v1-${artifactSha256}`) throw new Error('release candidate identity is not product-bound');
          const fd = fs.openSync(output, fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW, 0o600);
          try { fs.writeSync(fd, canonicalJson(expected), 'utf8'); fs.fsyncSync(fd); } finally { fs.closeSync(fd); }
          NODE
      - name: Secret-scan every candidate artifact, archive, and expanded PKG before upload
        shell: bash
        run: |
          set -euo pipefail
          scan_evidence="$RUNNER_TEMP/agentpass-candidate-artifact-scan.json"
          ci_preflight_scan_root="$RUNNER_TEMP/agentpass-ci-preflight-scan"
          ci_preflight_scan_evidence="$RUNNER_TEMP/agentpass-ci-preflight-scan.json"
          integrity_dir="$RUNNER_TEMP/integrity-evidence"
          mkdir -m 0700 -p "$integrity_dir" "$ci_preflight_scan_root"
          [[ ! -e "$scan_evidence" && ! -e "$ci_preflight_scan_evidence" ]] || { echo "candidate scan evidence path already exists" >&2; exit 1; }
          install -m 0600 "$RUNNER_TEMP/candidate/ci-preflight.json" "$ci_preflight_scan_root/ci-preflight.json"
          node scripts/release/ci-preflight.mjs artifact-scan "$ci_preflight_scan_root" "$ci_preflight_scan_evidence"
          install -m 0644 "$RUNNER_TEMP/candidate/ci-preflight.json" "$integrity_dir/ci-preflight.json"
          rm -f "$RUNNER_TEMP/candidate/ci-preflight.json"
          node scripts/release/ci-preflight.mjs artifact-scan "$RUNNER_TEMP/candidate" "$scan_evidence"
          install -m 0644 "$scan_evidence" "$integrity_dir/artifact-scan.json"
      - name: Stage exact macOS distribution evidence for promotion
        shell: bash
        run: |
          set -euo pipefail
          integrity_dir="$RUNNER_TEMP/integrity-evidence"
          install -m 0644 "$RUNNER_TEMP/distribution-input/artifact-inventory.json" "$integrity_dir/macos-artifact-inventory.json"
          install -m 0644 "$RUNNER_TEMP/distribution-input/notary.json" "$integrity_dir/macos-notary.json"
          install -m 0644 "$RUNNER_TEMP/distribution-input/staple.json" "$integrity_dir/macos-staple.json"
          install -m 0644 "$RUNNER_TEMP/distribution-input/gatekeeper.json" "$integrity_dir/macos-gatekeeper.json"
          install -m 0644 "$RUNNER_TEMP/distribution-input/identity.json" "$integrity_dir/macos-identity.json"
          install -m 0644 "$RUNNER_TEMP/distribution-input/verification.json" "$integrity_dir/macos-verification.json"
          install -m 0644 "$RUNNER_TEMP/distribution-input/provenance.json" "$integrity_dir/macos-provenance.json"
          install -m 0644 "$RUNNER_TEMP/distribution-evidence/distribution-evidence.json" "$integrity_dir/macos-distribution-evidence.json"
          install -m 0644 "$RUNNER_TEMP/distribution-input/promotion-artifact-gate.json" "$integrity_dir/macos-promotion-artifact-gate.json"
      - name: Archive-scan the final raw evidence upload inventory
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/archive-secret-scan.mjs "$RUNNER_TEMP/integrity-evidence" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notarized-release-candidate
          path: |
            ${{ runner.temp }}/candidate/*.pkg
            ${{ runner.temp }}/candidate/*.spdx.json
            ${{ runner.temp }}/candidate/*.database-migration-manifest.json
            ${{ runner.temp }}/candidate/release-attestation.json
            ${{ runner.temp }}/candidate/*.release-manifest.json
            ${{ runner.temp }}/candidate/*.release-manifest.sig
            ${{ runner.temp }}/candidate/release-manifest.public.pem
            ${{ runner.temp }}/candidate/SHA256SUMS
            ${{ runner.temp }}/candidate/notarytool-result.json
            ${{ runner.temp }}/candidate/stapler-result.txt
            ${{ runner.temp }}/candidate/AgentPassQualificationController-*-macos-universal.tar
            ${{ runner.temp }}/candidate/controller-identity.json
            ${{ runner.temp }}/candidate/controller-notarytool-result.json
            ${{ runner.temp }}/candidate/controller-stapler-result.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-integrity-evidence
          path: |
            ${{ runner.temp }}/integrity-evidence/ci-preflight.json
            ${{ runner.temp }}/integrity-evidence/artifact-scan.json
            ${{ runner.temp }}/integrity-evidence/kms-qualification.json
            ${{ runner.temp }}/integrity-evidence/platform-auth-qualification.json
            ${{ runner.temp }}/integrity-evidence/release-evidence-expected-candidate.json
            ${{ runner.temp }}/integrity-evidence/macos-*.json
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/agentpass-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/agentpass-signing"
          rm -rf "$RUNNER_TEMP/agentpass-attestation-inputs"
          rm -rf "$RUNNER_TEMP/controller"
          rm -f "$RUNNER_TEMP/agentpass-candidate-artifact-scan.json"
          rm -f "$RUNNER_TEMP/agentpass-ci-preflight-scan.json"
          rm -rf "$RUNNER_TEMP/agentpass-ci-preflight-scan"
          rm -rf "$RUNNER_TEMP/integrity-evidence"
          rm -rf "$RUNNER_TEMP/distribution-input" "$RUNNER_TEMP/distribution-evidence"

          : "${AGENTPASS_KMS_QUALIFICATION_EVIDENCE_JSON:?protected KMS qualification evidence input is required}"
          : "${AGENTPASS_PLATFORM_AUTH_QUALIFICATION_EVIDENCE_JSON:?protected Platform Auth qualification evidence input is required}"
          : "${AGENTPASS_KMS_QUALIFICATION_DEPLOYMENT_DIGEST:?protected KMS deployment digest is required}"
          : "${AGENTPASS_KMS_QUALIFICATION_RUN_ID:?protected KMS qualification run ID is required}"
          : "${AGENTPASS_KMS_QUALIFICATION_JOB_ID:?protected KMS qualification job ID is required}"
          : "${AGENTPASS_PLATFORM_AUTH_QUALIFICATION_PRIMARY_DEPLOYMENT_DIGEST:?protected Platform Auth primary deployment digest is required}"
          : "${AGENTPASS_PLATFORM_AUTH_QUALIFICATION_SECONDARY_DEPLOYMENT_DIGEST:?protected Platform Auth secondary deployment digest is required}"
          : "${AGENTPASS_PLATFORM_AUTH_QUALIFICATION_RUN_ID:?protected Platform Auth qualification run ID is required}"
          : "${AGENTPASS_PLATFORM_AUTH_QUALIFICATION_JOB_ID:?protected Platform Auth qualification job ID is required}"
          product_sha256="$(node --input-type=module - "$MANIFEST" <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const products = manifest.artifacts?.filter((item) => item.role === 'product');
          if (products?.length !== 1 || !/^[0-9a-f]{64}$/.test(products[0].sha256)) throw new Error('release manifest product digest is invalid');
          process.stdout.write(products[0].sha256);
          NODE
          )"
          mkdir -m 0700 -p "$RUNNER_TEMP/integrity-evidence"
          node --input-type=module - "$RUNNER_TEMP/integrity-evidence/kms-qualification.json" "$RUNNER_TEMP/integrity-evidence/platform-auth-qualification.json" "$AGENTPASS_RELEASE_COMMIT" <<'NODE'
          import fs from 'node:fs';
          import { canonicalJson } from './packages/protocol/src/index.mjs';
          const [kmsPath, platformPath, expectedSourceCommit] = process.argv.slice(2);
          for (const [output, input] of [[kmsPath, process.env.AGENTPASS_KMS_QUALIFICATION_EVIDENCE_JSON], [platformPath, process.env.AGENTPASS_PLATFORM_AUTH_QUALIFICATION_EVIDENCE_JSON]]) {
            if (typeof input !== 'string' || input.length === 0) throw new Error('protected qualification evidence input is missing');
            let value;
            try { value = JSON.parse(input); } catch { throw new Error('protected qualification evidence input is not JSON'); }
            if (input !== canonicalJson(value)) throw new Error('protected qualification evidence input must be canonical JSON');
            if (value.status !== 'passed' || value.qualified !== true || value.source_commit !== expectedSourceCommit) throw new Error('protected qualification evidence is not passed and source-bound');
            const fd = fs.openSync(output, fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW, 0o600);
            try { fs.writeSync(fd, input, 'utf8'); fs.fsyncSync(fd); } finally { fs.closeSync(fd); }
          }

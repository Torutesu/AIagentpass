name: P0-C hardware qualification

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Completed Release candidate workflow run ID to qualify
        required: true
        type: string
      release_artifact_name:
        description: Exact artifact name emitted by that run
        required: true
        default: notarized-release-candidate
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: p0c-hardware-qualification-${{ inputs.release_run_id }}
  cancel-in-progress: false

env:
  EXPECTED_CANDIDATE_ARTIFACT: notarized-release-candidate
  P0C_GATE_DRIVER_DIR: /opt/agentpass/p0c/gates

jobs:
  validate-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'Torutesu/AIagentpass' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.validate.outputs.run_id }}
      artifact_name: ${{ steps.validate.outputs.artifact_name }}
      candidate_head_sha: ${{ steps.validate.outputs.candidate_head_sha }}
    steps:
      - id: validate
        name: Validate exact same-repository release-candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_ARTIFACT_NAME: ${{ inputs.release_artifact_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Torutesu/AIagentpass" ]] || { echo "This workflow is restricted to the canonical repository" >&2; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "This workflow must run from the protected main branch" >&2; exit 1; }
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]] || { echo "release_run_id must be a decimal workflow run ID" >&2; exit 1; }
          [[ "$RELEASE_ARTIFACT_NAME" == "$EXPECTED_CANDIDATE_ARTIFACT" ]] || { echo "Only the exact notarized-release-candidate artifact is accepted" >&2; exit 1; }

          run_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .name == "Release candidate" and
            .path == ".github/workflows/release-candidate.yml" and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .head_branch == "main" and
            .head_repository.full_name == $repo and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' <<<"$run_json" >/dev/null

          candidate_head_sha="$(jq -er '.head_sha' <<<"$run_json")"
          printf 'run_id=%s\n' "$RELEASE_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$RELEASE_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          printf 'candidate_head_sha=%s\n' "$candidate_head_sha" >> "$GITHUB_OUTPUT"

  apple-silicon-qualification:
    if: ${{ needs.validate-candidate.result == 'success' && github.event_name == 'workflow_dispatch' && github.repository == 'Torutesu/AIagentpass' && github.ref == 'refs/heads/main' }}
    needs: validate-candidate
    runs-on: [self-hosted, macOS, agentpass-p0c-apple-silicon]
    environment: p0c-hardware-apple-silicon
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_RUN_ID: ${{ needs.validate-candidate.outputs.run_id }}
      CANDIDATE_ARTIFACT_NAME: ${{ needs.validate-candidate.outputs.artifact_name }}
      RELEASE_MANIFEST_FINGERPRINT: ${{ vars.AGENTPASS_RELEASE_MANIFEST_KEY_FINGERPRINT }}
      EXPECTED_TEAM_ID: ${{ vars.AGENTPASS_RELEASE_TEAM_ID }}
      AGENTPASS_APP_IDENTIFIER_PREFIX: ${{ vars.AGENTPASS_RELEASE_APP_IDENTIFIER_PREFIX }}
      OPERATOR_ID: ${{ vars.AGENTPASS_P0C_APPLE_SILICON_OPERATOR_ID }}
      OPERATOR_FINGERPRINT: ${{ vars.AGENTPASS_P0C_APPLE_SILICON_OPERATOR_FINGERPRINT }}
      OPERATOR_PUBLIC_KEY_B64: ${{ vars.AGENTPASS_P0C_APPLE_SILICON_OPERATOR_PUBLIC_KEY_BASE64 }}
      BROWSER_VERSIONS_JSON: ${{ vars.AGENTPASS_P0C_BROWSER_VERSIONS_JSON }}
      OPERATOR_PRIVATE_KEY_B64: ${{ secrets.AGENTPASS_P0C_APPLE_SILICON_OPERATOR_PRIVATE_KEY_BASE64 }}
      GATE_DRIVER_DIR: /opt/agentpass/p0c/gates
      QUALIFICATION_CONFIG_TOOL_ROOT: /opt/agentpass/p0c/qualification-tool
      QUALIFICATION_DEVICE_CLIENT_CONFIG_B64: ${{ secrets.QUALIFICATION_DEVICE_CLIENT_CONFIG_B64 }}
      QUALIFICATION_RELAY_REQUEST_B64: ${{ secrets.QUALIFICATION_RELAY_REQUEST_B64 }}
      CONTROLLER_ARCHITECTURE: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - id: paths
        name: Create clean candidate and qualification directories
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_DIR="$RUNNER_TEMP/agentpass-p0c-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-apple-silicon"
          OUTPUT_DIR="$RUNNER_TEMP/agentpass-p0c-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-apple-silicon"
          [[ ! -e "$CANDIDATE_DIR" && ! -e "$OUTPUT_DIR" ]] || { echo "runner temporary paths already exist" >&2; exit 1; }
          /bin/mkdir -m 0700 "$CANDIDATE_DIR" "$OUTPUT_DIR"
          printf 'candidate_dir=%s\noutput_dir=%s\n' "$CANDIDATE_DIR" "$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          printf 'CANDIDATE_DIR=%s\nOUTPUT_DIR=%s\n' "$CANDIDATE_DIR" "$OUTPUT_DIR" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.validate-candidate.outputs.artifact_name }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.candidate_dir }}

      - id: candidate
        name: Catalog exact candidate files without executing candidate content
        env:
          CANDIDATE_DIR: ${{ steps.paths.outputs.candidate_dir }}
          EXPECTED_TEAM_ID: ${{ env.EXPECTED_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import {
            parseCanonicalExternalQualificationControllerIdentity,
            validateExternalQualificationControllerIdentity
          } from './scripts/release/n3e/controller-identity-contract.mjs';

          const dir = path.resolve(process.env.CANDIDATE_DIR);
          const entries = fs.readdirSync(dir, { withFileTypes: true });
          const files = new Map();
          for (const entry of entries) {
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(entry.name) || entry.isSymbolicLink() || !entry.isFile()) throw new Error('candidate contains an unsafe entry');
            const full = path.join(dir, entry.name);
            const stat = fs.lstatSync(full);
            if (stat.nlink !== 1 || (stat.mode & 0o022) !== 0) throw new Error('candidate file is not a protected single-link file');
            files.set(entry.name, full);
          }
          const exactlyOne = (predicate, label) => {
            const matches = [...files.entries()].filter(([name]) => predicate(name));
            if (matches.length !== 1) throw new Error(`candidate must contain exactly one ${label}`);
            return matches[0][1];
          };
          const fixed = ['release-manifest.public.pem', 'SHA256SUMS', 'notarytool-result.json', 'stapler-result.txt', 'release-attestation.json'];
          const manifest = exactlyOne((name) => name.endsWith('.release-manifest.json'), 'release manifest');
          const signature = exactlyOne((name) => name.endsWith('.release-manifest.sig'), 'release manifest signature');
          const sbom = exactlyOne((name) => name.endsWith('.spdx.json'), 'SPDX SBOM');
          const artifact = exactlyOne((name) => name.endsWith('-macos-universal.pkg'), 'universal PKG');
          const migration = exactlyOne((name) => name.endsWith('.database-migration-manifest.json'), 'database migration manifest');
          const manifestValue = JSON.parse(fs.readFileSync(manifest, 'utf8'));
          if (manifestValue.schema_version !== 4) throw new Error('candidate release manifest must be v4');
          const controller = manifestValue.external_qualification_controller;
          if (!controller || JSON.stringify(Object.keys(controller).sort()) !== JSON.stringify(['identity', 'identity_document', 'notarization'])) throw new Error('candidate external controller binding is not exact');
          const identityDocument = controller.identity_document;
          if (!identityDocument || JSON.stringify(Object.keys(identityDocument).sort()) !== JSON.stringify(['bytes', 'name', 'sha256']) || !files.has(identityDocument.name)) throw new Error('candidate controller identity document binding is invalid');
          const identityBytes = fs.readFileSync(path.join(dir, identityDocument.name));
          if (identityBytes.length !== identityDocument.bytes || crypto.createHash('sha256').update(identityBytes).digest('hex') !== identityDocument.sha256) throw new Error('candidate controller identity document digest mismatch');
          const identity = parseCanonicalExternalQualificationControllerIdentity(identityBytes);
          if (JSON.stringify(identity) !== JSON.stringify(validateExternalQualificationControllerIdentity(controller.identity, { expectedTeamId: process.env.EXPECTED_TEAM_ID }))) throw new Error('candidate controller identity does not match its document');
          const controllerArtifacts = manifestValue.artifacts?.filter((item) => item.role === 'external_qualification_controller');
          if (controllerArtifacts?.length !== 1 || controllerArtifacts[0].name !== identity.archive_name || controllerArtifacts[0].role === 'product' || !files.has(identity.archive_name)) throw new Error('candidate controller archive role is not exact');
          const controllerArchive = controllerArtifacts[0];
          const controllerBytes = fs.readFileSync(path.join(dir, controllerArchive.name));
          if (controllerBytes.length !== controllerArchive.bytes || crypto.createHash('sha256').update(controllerBytes).digest('hex') !== controllerArchive.sha256 || identity.archive_bytes !== controllerArchive.bytes || identity.archive_sha256 !== controllerArchive.sha256) throw new Error('candidate controller archive digest mismatch');
          const controllerNotarization = controller.notarization;
          if (!controllerNotarization || JSON.stringify(Object.keys(controllerNotarization).sort()) !== JSON.stringify(['evidence', 'status', 'submission_ids']) || controllerNotarization.status !== 'accepted_stapled' || !Array.isArray(controllerNotarization.submission_ids) || controllerNotarization.submission_ids.length === 0 || !Array.isArray(controllerNotarization.evidence) || controllerNotarization.evidence.length !== 2) throw new Error('candidate controller notarization is incomplete');
          const controllerEvidenceKinds = new Set();
          for (const evidence of controllerNotarization.evidence) {
            if (JSON.stringify(Object.keys(evidence).sort()) !== JSON.stringify(['bytes', 'kind', 'name', 'sha256']) || !files.has(evidence.name) || !['notarytool_result', 'stapler_result'].includes(evidence.kind) || controllerEvidenceKinds.has(evidence.kind)) throw new Error('candidate controller notarization evidence is invalid');
            controllerEvidenceKinds.add(evidence.kind);
            const evidenceBytes = fs.readFileSync(path.join(dir, evidence.name));
            if (evidenceBytes.length !== evidence.bytes || crypto.createHash('sha256').update(evidenceBytes).digest('hex') !== evidence.sha256) throw new Error('candidate controller notarization evidence digest mismatch');
          }
          if (!controllerEvidenceKinds.has('notarytool_result') || !controllerEvidenceKinds.has('stapler_result')) throw new Error('candidate controller notarization evidence kinds are incomplete');
          const allowed = new Set([...fixed, path.basename(manifest), path.basename(signature), path.basename(sbom), path.basename(artifact), path.basename(migration), controllerArchive.name, identityDocument.name, ...controllerNotarization.evidence.map((item) => item.name)]);
          if (files.size !== allowed.size || [...files.keys()].some((name) => !allowed.has(name))) throw new Error('candidate contains unexpected files');
          const product = manifestValue.artifacts?.filter((item) => item.role === 'product');
          if (product?.length !== 1 || product[0].name !== path.basename(artifact) || product[0].name === controllerArchive.name) throw new Error('candidate product does not match its signed manifest');
          if (manifestValue.artifacts?.every((item) => item.name !== 'release-attestation.json')) throw new Error('signed candidate must include release-attestation.json');
          const artifactHash = crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex');
          if (product[0].sha256 !== artifactHash) throw new Error('candidate product hash does not match its signed manifest');
          if (manifestValue.candidate_id !== `release-pkg-sha256-v1-${product[0].sha256}`) throw new Error('candidate_id is not bound to the product PKG digest');
          const output = process.env.GITHUB_OUTPUT;
          for (const [key, value] of Object.entries({ manifest, signature, public_key: path.join(dir, 'release-manifest.public.pem'), artifact, qualification_client: '/Applications/AgentPass.app/Contents/Library/HelperTools/agentpass-qualification-grant-client', sbom, attestation: path.join(dir, 'release-attestation.json'), controller_archive: path.join(dir, controllerArchive.name), controller_identity: path.join(dir, identityDocument.name) })) fs.appendFileSync(output, `${key}=${value}\n`);
          NODE

      - id: controller-cdhash
        name: Select matching controller architecture CDHash for later root provisioning without claiming physical execution
        env:
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          CONTROLLER_ARCHITECTURE: ${{ env.CONTROLLER_ARCHITECTURE }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'));
          const hashes = manifest.external_qualification_controller?.identity?.code_directory_hashes;
          const matches = Array.isArray(hashes) ? hashes.filter((item) => item?.architecture === process.env.CONTROLLER_ARCHITECTURE) : [];
          if (matches.length !== 1 || !/^[0-9a-f]{40}$/.test(matches[0].hash) || /^0+$/.test(matches[0].hash)) throw new Error('controller CDHash does not match the lane architecture');
          fs.appendFileSync(process.env.GITHUB_ENV, `AGENTPASS_P0C_QUALIFICATION_CONTROLLER_CDHASH=${matches[0].hash}\nQUALIFICATION_CONTROLLER_CDHASH=${matches[0].hash}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `controller_cdhash=${matches[0].hash}\n`);
          NODE

      - name: Verify signed candidate before any qualification driver
        env:
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MANIFEST_SIGNATURE: ${{ steps.candidate.outputs.signature }}
          MANIFEST_PUBLIC_KEY: ${{ steps.candidate.outputs.public_key }}
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
          QUALIFICATION_CLIENT_SOURCE: ${{ steps.candidate.outputs.qualification_client }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_MANIFEST_FINGERPRINT:?release manifest verification fingerprint is required}"
          : "${EXPECTED_TEAM_ID:?release Team ID is required}"
          node scripts/release/verify-release.mjs "$MANIFEST" "$MANIFEST_SIGNATURE" "$MANIFEST_PUBLIC_KEY" "$RELEASE_MANIFEST_FINGERPRINT"
          scripts/release/verify-macos-release.sh "$MANIFEST" "$MANIFEST_SIGNATURE" "$MANIFEST_PUBLIC_KEY" "$RELEASE_MANIFEST_FINGERPRINT" "$EXPECTED_TEAM_ID"
          test -s "$PRODUCT_PKG"
          bash native/macos/scripts/verify-installed-qualification-client.sh "$QUALIFICATION_CLIENT_SOURCE" "$EXPECTED_TEAM_ID" "$AGENTPASS_APP_IDENTIFIER_PREFIX"

      - name: Verify root-owned qualification config tool matches the trusted workflow commit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = '/opt/agentpass/p0c/qualification-tool';
          if (process.env.QUALIFICATION_CONFIG_TOOL_ROOT !== root) throw new Error('qualification tool root is not fixed');
          const expected = [
            ['generate-release-attestation.mjs', 'scripts/release/generate-release-attestation.mjs'],
            ['n3e/controller-candidate-contract.mjs', 'scripts/release/n3e/controller-candidate-contract.mjs'],
            ['n3e/controller-identity-contract.mjs', 'scripts/release/n3e/controller-identity-contract.mjs'],
            ['n3e/materialize-controller-candidate.mjs', 'scripts/release/n3e/materialize-controller-candidate.mjs'],
            ['n3e/materialize-qualification-activation.mjs', 'scripts/release/n3e/materialize-qualification-activation.mjs'],
            ['n3e/provision-qualification-config.mjs', 'scripts/release/n3e/provision-qualification-config.mjs'],
            ['n3e/qualification-activation-contract.mjs', 'scripts/release/n3e/qualification-activation-contract.mjs'],
            ['n3e/qualification-canonical-json.mjs', 'scripts/release/n3e/qualification-canonical-json.mjs'],
            ['n3e/qualification-device-relay.mjs', 'scripts/release/n3e/qualification-device-relay.mjs'],
            ['n3e/qualification-input-materializer.mjs', 'scripts/release/n3e/qualification-input-materializer.mjs'],
            ['n3e/qualification-release-materializer.mjs', 'scripts/release/n3e/qualification-release-materializer.mjs'],
            ['n3e/qualification-release-trust.mjs', 'scripts/release/n3e/qualification-release-trust.mjs'],
            ['n3e/qualification-run-binding.mjs', 'scripts/release/n3e/qualification-run-binding.mjs'],
            ['n3e/qualification-scenario-driver.mjs', 'scripts/release/n3e/qualification-scenario-driver.mjs'],
            ['n3e/qualification-suite-evidence.mjs', 'scripts/release/n3e/qualification-suite-evidence.mjs'],
            ['n3e/qualification-suite-input.mjs', 'scripts/release/n3e/qualification-suite-input.mjs'],
            ['n3e/qualification-suite-orchestrator.mjs', 'scripts/release/n3e/qualification-suite-orchestrator.mjs'],
            ['n3e/qualification-unarmed-control.mjs', 'scripts/release/n3e/qualification-unarmed-control.mjs'],
            ['n3e/run-fixed-protected-qualification.mjs', 'scripts/release/n3e/run-fixed-protected-qualification.mjs'],
            ['n3e/run-protected-qualification.mjs', 'scripts/release/n3e/run-protected-qualification.mjs'],
            ['p0c/lib/candidate-checkpoint.mjs', 'scripts/release/p0c/lib/candidate-checkpoint.mjs']
          ];
          const safe = (file, directory = false) => {
            const stat = fs.lstatSync(file);
            if (stat.isSymbolicLink() || stat.uid !== 0 || (stat.mode & 0o022) !== 0 || (directory ? !stat.isDirectory() : !stat.isFile() || stat.nlink !== 1)) throw new Error('qualification tool installation is unsafe');
          };
          safe(root, true); safe(path.join(root, 'n3e'), true);
          const manifestPath = path.join(root, 'manifest.json'); safe(manifestPath);
          const manifestBytes = fs.readFileSync(manifestPath); const manifest = JSON.parse(manifestBytes);
          if (JSON.stringify(Object.keys(manifest).sort()) !== JSON.stringify(['files', 'schema_version']) || manifest.schema_version !== 1 || !Array.isArray(manifest.files) || manifest.files.length !== expected.length) throw new Error('qualification tool manifest is invalid');
          for (let index = 0; index < expected.length; index += 1) {
            const [installedName, sourceName] = expected[index]; const item = manifest.files[index];
            if (JSON.stringify(Object.keys(item).sort()) !== JSON.stringify(['path', 'sha256']) || item.path !== installedName || !/^[0-9a-f]{64}$/.test(item.sha256)) throw new Error('qualification tool manifest binding is invalid');
            const installed = path.join(root, installedName); safe(installed);
            const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (digest(installed) !== item.sha256 || digest(sourceName) !== item.sha256) throw new Error('protected qualification tool is stale or substituted');
          }
          NODE

      - name: Generate immutable hardware report template from signed release evidence
        env:
          TEMPLATE_OUT: ${{ steps.paths.outputs.output_dir }}/template.json
          BROWSER_VERSIONS_PATH: ${{ steps.paths.outputs.output_dir }}/browser-versions.json
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MANIFEST_SIGNATURE: ${{ steps.candidate.outputs.signature }}
          MANIFEST_PUBLIC_KEY: ${{ steps.candidate.outputs.public_key }}
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BROWSER_VERSIONS_JSON:?protected browser version inventory is required}"
          node --input-type=module - "$BROWSER_VERSIONS_PATH" <<'NODE'
          import fs from 'node:fs';
          const path = process.argv[2];
          const bytes = Buffer.from(process.env.BROWSER_VERSIONS_JSON, 'utf8');
          const fd = fs.openSync(path, fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW, 0o600);
          try { fs.writeSync(fd, bytes); fs.fsyncSync(fd); } finally { fs.closeSync(fd); }
          NODE
          node scripts/release/generate-hardware-qualification-template.mjs \
            --release-manifest "$MANIFEST" --release-signature "$MANIFEST_SIGNATURE" \
            --release-public-key "$MANIFEST_PUBLIC_KEY" --release-fingerprint "$RELEASE_MANIFEST_FINGERPRINT" \
            --artifact "$PRODUCT_PKG" --operator "$OPERATOR_ID" \
            --operator-key-fingerprint "$OPERATOR_FINGERPRINT" --browser-versions "$BROWSER_VERSIONS_PATH" \
            --output "$TEMPLATE_OUT"

      - name: Materialize lane operator key in private temporary storage
        env:
          PRIVATE_KEY_PATH: ${{ steps.paths.outputs.output_dir }}/operator-private.pem
          PUBLIC_KEY_PATH: ${{ steps.paths.outputs.output_dir }}/operator-public.pem
        shell: bash
        run: |
          set -euo pipefail
          : "${OPERATOR_PRIVATE_KEY_B64:?lane operator private key is required}"
          : "${OPERATOR_PUBLIC_KEY_B64:?lane operator public key is required}"
          : "${OPERATOR_FINGERPRINT:?lane operator fingerprint is required}"
          umask 077
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const write = (path, value, mode) => fs.writeFileSync(path, Buffer.from(value, 'base64'), { flag: 'wx', mode });
          write(process.env.PRIVATE_KEY_PATH, process.env.OPERATOR_PRIVATE_KEY_B64, 0o600);
          write(process.env.PUBLIC_KEY_PATH, process.env.OPERATOR_PUBLIC_KEY_B64, 0o644);
          NODE

      - name: Run fixed root-owned P0-C gate drivers
        env:
          TEMPLATE: ${{ steps.paths.outputs.output_dir }}/template.json
          REPORT: ${{ steps.paths.outputs.output_dir }}/report.json
          EVIDENCE_DIR: ${{ steps.paths.outputs.output_dir }}/evidence
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/mkdir -m 0700 "$EVIDENCE_DIR"
          node scripts/release/run-p0c-qualification.mjs \
            --template "$TEMPLATE" \
            --output "$REPORT" \
            --artifact "$PRODUCT_PKG" \
            --gate-drivers "$GATE_DRIVER_DIR" \
            --evidence-dir "$EVIDENCE_DIR" \
            --operator "$OPERATOR_ID"

      - name: Run protected N3-E unarmed and six-scenario suite
        env:
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MANIFEST_SIGNATURE: ${{ steps.candidate.outputs.signature }}
          MANIFEST_PUBLIC_KEY: ${{ steps.candidate.outputs.public_key }}
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          : "${QUALIFICATION_DEVICE_CLIENT_CONFIG_B64:?protected qualification device client config is required}"
          : "${QUALIFICATION_RELAY_REQUEST_B64:?protected qualification relay request is required}"
          recover_n3e() {
            sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-device-relay.mjs recover
            sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-suite-orchestrator.mjs recover
            sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-release-materializer.mjs recover
          }
          trap recover_n3e EXIT
          sudo -n --preserve-env=QUALIFICATION_DEVICE_CLIENT_CONFIG_B64,QUALIFICATION_RELAY_REQUEST_B64 /usr/bin/node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = '/private/var/db/agentpass-qualification';
          const expected = fs.lstatSync(root);
          if (!expected.isDirectory() || expected.isSymbolicLink() || expected.uid !== 0 || expected.gid !== 0 || (expected.mode & 0o777) !== 0o700) throw new Error('qualification state directory is not root:wheel 0700');
          const decode = (value, maximum, label) => {
            if (typeof value !== 'string' || value.length === 0 || value.length > Math.ceil(maximum * 4 / 3) + 4 || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value)) throw new Error(`${label} is not strict base64`);
            const bytes = Buffer.from(value, 'base64');
            if (bytes.length === 0 || bytes.length > maximum || bytes.toString('base64') !== value) throw new Error(`${label} exceeds its bounded base64 contract`);
            return bytes;
          };
          const writeProtected = (name, value, maximum) => {
            const file = path.join(root, name);
            const bytes = decode(value, maximum, name);
            let fd;
            try {
              fd = fs.openSync(file, fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW, 0o600);
              fs.writeFileSync(fd, bytes); fs.fsyncSync(fd); fs.fchmodSync(fd, 0o600); fs.fchownSync(fd, 0, 0);
            } finally { if (fd !== undefined) fs.closeSync(fd); }
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.uid !== 0 || stat.gid !== 0 || stat.nlink !== 1 || (stat.mode & 0o777) !== 0o600) throw new Error(`${name} was not materialized with its protected inventory contract`);
          };
          writeProtected('device-client-config.json', process.env.QUALIFICATION_DEVICE_CLIENT_CONFIG_B64, 16 * 1024);
          writeProtected('relay-request.json', process.env.QUALIFICATION_RELAY_REQUEST_B64, 32 * 1024);
          NODE
          sudo -n /usr/bin/test -f /private/var/db/agentpass-qualification/candidate-checkpoint.json
          sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-release-materializer.mjs materialize "$CANDIDATE_DIR" "$MANIFEST" "$MANIFEST_SIGNATURE" "$MANIFEST_PUBLIC_KEY" "$RELEASE_MANIFEST_FINGERPRINT" "$PRODUCT_PKG"
          sudo -n /usr/bin/test -f /private/var/db/agentpass-qualification/release-trust.json
          sudo -n /usr/bin/test ! -e /private/var/db/agentpass-qualification/device-response.json
          sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-device-relay.mjs claim
          sudo -n /usr/bin/test ! -e /private/var/db/agentpass-qualification/relay-request.json
          sudo -n /usr/bin/test ! -e /private/var/db/agentpass-qualification/device-response.json
          sudo -n /usr/bin/test -f /private/var/db/agentpass-qualification/input.inbox.json
          sudo -n /usr/bin/test ! -e /private/var/db/agentpass-qualification/input.json
          sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-input-materializer.mjs materialize
          sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-suite-orchestrator.mjs run
          recover_n3e
          trap - EXIT

      - name: Sign and independently verify lane report
        env:
          REPORT: ${{ steps.paths.outputs.output_dir }}/report.json
          SIGNATURE: ${{ steps.paths.outputs.output_dir }}/report.sig
          PUBLIC_KEY: ${{ steps.paths.outputs.output_dir }}/operator-public.pem
          PRIVATE_KEY: ${{ steps.paths.outputs.output_dir }}/operator-private.pem
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MANIFEST_SIGNATURE: ${{ steps.candidate.outputs.signature }}
          MANIFEST_PUBLIC_KEY: ${{ steps.candidate.outputs.public_key }}
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
          EVIDENCE_DIR: ${{ steps.paths.outputs.output_dir }}/evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/sign-hardware-qualification.mjs \
            --report "$REPORT" --private-key "$PRIVATE_KEY" --signature "$SIGNATURE" \
            --public-key "$PUBLIC_KEY" --expected-fingerprint "$OPERATOR_FINGERPRINT"
          node scripts/release/validate-hardware-qualification.mjs \
            "$REPORT" "$PRODUCT_PKG" "$MANIFEST" "$MANIFEST_SIGNATURE" "$MANIFEST_PUBLIC_KEY" \
            "$RELEASE_MANIFEST_FINGERPRINT" "$SIGNATURE" "$PUBLIC_KEY" "$OPERATOR_FINGERPRINT" "$EVIDENCE_DIR"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0c-hardware-apple-silicon
          path: |
            ${{ steps.paths.outputs.output_dir }}/report.json
            ${{ steps.paths.outputs.output_dir }}/report.sig
            ${{ steps.paths.outputs.output_dir }}/operator-public.pem
            ${{ steps.paths.outputs.output_dir }}/evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Remove private operator key
        if: ${{ always() }}
        env:
          PRIVATE_KEY_PATH: ${{ steps.paths.outputs.output_dir }}/operator-private.pem
        shell: bash
        run: |
          set +e
          [[ -n "$PRIVATE_KEY_PATH" && "$PRIVATE_KEY_PATH" == "$RUNNER_TEMP"/agentpass-p0c-output-*/operator-private.pem ]] || exit 0
          chmod 000 "$PRIVATE_KEY_PATH" 2>/dev/null
          rm -f -- "$PRIVATE_KEY_PATH"

  intel-t2-qualification:
    if: ${{ needs.validate-candidate.result == 'success' && github.event_name == 'workflow_dispatch' && github.repository == 'Torutesu/AIagentpass' && github.ref == 'refs/heads/main' }}
    needs: validate-candidate
    runs-on: [self-hosted, macOS, agentpass-p0c-intel-t2]
    environment: p0c-hardware-intel-t2
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_RUN_ID: ${{ needs.validate-candidate.outputs.run_id }}
      CANDIDATE_ARTIFACT_NAME: ${{ needs.validate-candidate.outputs.artifact_name }}
      RELEASE_MANIFEST_FINGERPRINT: ${{ vars.AGENTPASS_RELEASE_MANIFEST_KEY_FINGERPRINT }}
      EXPECTED_TEAM_ID: ${{ vars.AGENTPASS_RELEASE_TEAM_ID }}
      AGENTPASS_APP_IDENTIFIER_PREFIX: ${{ vars.AGENTPASS_RELEASE_APP_IDENTIFIER_PREFIX }}
      OPERATOR_ID: ${{ vars.AGENTPASS_P0C_INTEL_T2_OPERATOR_ID }}
      OPERATOR_FINGERPRINT: ${{ vars.AGENTPASS_P0C_INTEL_T2_OPERATOR_FINGERPRINT }}
      OPERATOR_PUBLIC_KEY_B64: ${{ vars.AGENTPASS_P0C_INTEL_T2_OPERATOR_PUBLIC_KEY_BASE64 }}
      BROWSER_VERSIONS_JSON: ${{ vars.AGENTPASS_P0C_BROWSER_VERSIONS_JSON }}
      OPERATOR_PRIVATE_KEY_B64: ${{ secrets.AGENTPASS_P0C_INTEL_T2_OPERATOR_PRIVATE_KEY_BASE64 }}
      GATE_DRIVER_DIR: /opt/agentpass/p0c/gates
      QUALIFICATION_CONFIG_TOOL_ROOT: /opt/agentpass/p0c/qualification-tool
      QUALIFICATION_DEVICE_CLIENT_CONFIG_B64: ${{ secrets.QUALIFICATION_DEVICE_CLIENT_CONFIG_B64 }}
      QUALIFICATION_RELAY_REQUEST_B64: ${{ secrets.QUALIFICATION_RELAY_REQUEST_B64 }}
      CONTROLLER_ARCHITECTURE: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - id: paths
        name: Create clean candidate and qualification directories
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_DIR="$RUNNER_TEMP/agentpass-p0c-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-intel-t2"
          OUTPUT_DIR="$RUNNER_TEMP/agentpass-p0c-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-intel-t2"
          [[ ! -e "$CANDIDATE_DIR" && ! -e "$OUTPUT_DIR" ]] || { echo "runner temporary paths already exist" >&2; exit 1; }
          /bin/mkdir -m 0700 "$CANDIDATE_DIR" "$OUTPUT_DIR"
          printf 'candidate_dir=%s\noutput_dir=%s\n' "$CANDIDATE_DIR" "$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          printf 'CANDIDATE_DIR=%s\nOUTPUT_DIR=%s\n' "$CANDIDATE_DIR" "$OUTPUT_DIR" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.validate-candidate.outputs.artifact_name }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.candidate_dir }}

      - id: candidate
        name: Catalog exact candidate files without executing candidate content
        env:
          CANDIDATE_DIR: ${{ steps.paths.outputs.candidate_dir }}
          EXPECTED_TEAM_ID: ${{ env.EXPECTED_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import {
            parseCanonicalExternalQualificationControllerIdentity,
            validateExternalQualificationControllerIdentity
          } from './scripts/release/n3e/controller-identity-contract.mjs';
          const dir = path.resolve(process.env.CANDIDATE_DIR);
          const entries = fs.readdirSync(dir, { withFileTypes: true });
          const files = new Map();
          for (const entry of entries) {
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(entry.name) || entry.isSymbolicLink() || !entry.isFile()) throw new Error('candidate contains an unsafe entry');
            const full = path.join(dir, entry.name); const stat = fs.lstatSync(full);
            if (stat.nlink !== 1 || (stat.mode & 0o022) !== 0) throw new Error('candidate file is not a protected single-link file');
            files.set(entry.name, full);
          }
          const exactlyOne = (predicate, label) => { const matches = [...files.entries()].filter(([name]) => predicate(name)); if (matches.length !== 1) throw new Error(`candidate must contain exactly one ${label}`); return matches[0][1]; };
          const fixed = ['release-manifest.public.pem', 'SHA256SUMS', 'notarytool-result.json', 'stapler-result.txt', 'release-attestation.json'];
          const manifest = exactlyOne((name) => name.endsWith('.release-manifest.json'), 'release manifest');
          const signature = exactlyOne((name) => name.endsWith('.release-manifest.sig'), 'release manifest signature');
          const sbom = exactlyOne((name) => name.endsWith('.spdx.json'), 'SPDX SBOM');
          const artifact = exactlyOne((name) => name.endsWith('-macos-universal.pkg'), 'universal PKG');
          const migration = exactlyOne((name) => name.endsWith('.database-migration-manifest.json'), 'database migration manifest');
          const manifestValue = JSON.parse(fs.readFileSync(manifest, 'utf8'));
          if (manifestValue.schema_version !== 4) throw new Error('candidate release manifest must be v4');
          const controller = manifestValue.external_qualification_controller;
          if (!controller || JSON.stringify(Object.keys(controller).sort()) !== JSON.stringify(['identity', 'identity_document', 'notarization'])) throw new Error('candidate external controller binding is not exact');
          const identityDocument = controller.identity_document;
          if (!identityDocument || JSON.stringify(Object.keys(identityDocument).sort()) !== JSON.stringify(['bytes', 'name', 'sha256']) || !files.has(identityDocument.name)) throw new Error('candidate controller identity document binding is invalid');
          const identityBytes = fs.readFileSync(path.join(dir, identityDocument.name));
          if (identityBytes.length !== identityDocument.bytes || crypto.createHash('sha256').update(identityBytes).digest('hex') !== identityDocument.sha256) throw new Error('candidate controller identity document digest mismatch');
          const identity = parseCanonicalExternalQualificationControllerIdentity(identityBytes);
          if (JSON.stringify(identity) !== JSON.stringify(validateExternalQualificationControllerIdentity(controller.identity, { expectedTeamId: process.env.EXPECTED_TEAM_ID }))) throw new Error('candidate controller identity does not match its document');
          const controllerArtifacts = manifestValue.artifacts?.filter((item) => item.role === 'external_qualification_controller');
          if (controllerArtifacts?.length !== 1 || controllerArtifacts[0].name !== identity.archive_name || controllerArtifacts[0].role === 'product' || !files.has(identity.archive_name)) throw new Error('candidate controller archive role is not exact');
          const controllerArchive = controllerArtifacts[0];
          const controllerBytes = fs.readFileSync(path.join(dir, controllerArchive.name));
          if (controllerBytes.length !== controllerArchive.bytes || crypto.createHash('sha256').update(controllerBytes).digest('hex') !== controllerArchive.sha256 || identity.archive_bytes !== controllerArchive.bytes || identity.archive_sha256 !== controllerArchive.sha256) throw new Error('candidate controller archive digest mismatch');
          const controllerNotarization = controller.notarization;
          if (!controllerNotarization || JSON.stringify(Object.keys(controllerNotarization).sort()) !== JSON.stringify(['evidence', 'status', 'submission_ids']) || controllerNotarization.status !== 'accepted_stapled' || !Array.isArray(controllerNotarization.submission_ids) || controllerNotarization.submission_ids.length === 0 || !Array.isArray(controllerNotarization.evidence) || controllerNotarization.evidence.length !== 2) throw new Error('candidate controller notarization is incomplete');
          const controllerEvidenceKinds = new Set();
          for (const evidence of controllerNotarization.evidence) {
            if (JSON.stringify(Object.keys(evidence).sort()) !== JSON.stringify(['bytes', 'kind', 'name', 'sha256']) || !files.has(evidence.name) || !['notarytool_result', 'stapler_result'].includes(evidence.kind) || controllerEvidenceKinds.has(evidence.kind)) throw new Error('candidate controller notarization evidence is invalid');
            controllerEvidenceKinds.add(evidence.kind);
            const evidenceBytes = fs.readFileSync(path.join(dir, evidence.name));
            if (evidenceBytes.length !== evidence.bytes || crypto.createHash('sha256').update(evidenceBytes).digest('hex') !== evidence.sha256) throw new Error('candidate controller notarization evidence digest mismatch');
          }
          if (!controllerEvidenceKinds.has('notarytool_result') || !controllerEvidenceKinds.has('stapler_result')) throw new Error('candidate controller notarization evidence kinds are incomplete');
          const allowed = new Set([...fixed, path.basename(manifest), path.basename(signature), path.basename(sbom), path.basename(artifact), path.basename(migration), controllerArchive.name, identityDocument.name, ...controllerNotarization.evidence.map((item) => item.name)]);
          if (files.size !== allowed.size || [...files.keys()].some((name) => !allowed.has(name))) throw new Error('candidate contains unexpected files');
          const product = manifestValue.artifacts?.filter((item) => item.role === 'product');
          if (product?.length !== 1 || product[0].name !== path.basename(artifact) || product[0].name === controllerArchive.name) throw new Error('candidate product does not match its signed manifest');
          if (manifestValue.artifacts?.every((item) => item.name !== 'release-attestation.json')) throw new Error('signed candidate must include release-attestation.json');
          if (product[0].sha256 !== crypto.createHash('sha256').update(fs.readFileSync(artifact)).digest('hex')) throw new Error('candidate product hash does not match its signed manifest');
          if (manifestValue.candidate_id !== `release-pkg-sha256-v1-${product[0].sha256}`) throw new Error('candidate_id is not bound to the product PKG digest');
          const output = process.env.GITHUB_OUTPUT;
          for (const [key, value] of Object.entries({ manifest, signature, public_key: path.join(dir, 'release-manifest.public.pem'), artifact, qualification_client: '/Applications/AgentPass.app/Contents/Library/HelperTools/agentpass-qualification-grant-client', sbom, attestation: path.join(dir, 'release-attestation.json'), controller_archive: path.join(dir, controllerArchive.name), controller_identity: path.join(dir, identityDocument.name) })) fs.appendFileSync(output, `${key}=${value}\n`);
          NODE

      - id: controller-cdhash
        name: Select matching controller architecture CDHash for later root provisioning without claiming physical execution
        env:
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          CONTROLLER_ARCHITECTURE: ${{ env.CONTROLLER_ARCHITECTURE }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'));
          const hashes = manifest.external_qualification_controller?.identity?.code_directory_hashes;
          const matches = Array.isArray(hashes) ? hashes.filter((item) => item?.architecture === process.env.CONTROLLER_ARCHITECTURE) : [];
          if (matches.length !== 1 || !/^[0-9a-f]{40}$/.test(matches[0].hash) || /^0+$/.test(matches[0].hash)) throw new Error('controller CDHash does not match the lane architecture');
          fs.appendFileSync(process.env.GITHUB_ENV, `AGENTPASS_P0C_QUALIFICATION_CONTROLLER_CDHASH=${matches[0].hash}\nQUALIFICATION_CONTROLLER_CDHASH=${matches[0].hash}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `controller_cdhash=${matches[0].hash}\n`);
          NODE

      - name: Verify signed candidate before any qualification driver
        env:
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MANIFEST_SIGNATURE: ${{ steps.candidate.outputs.signature }}
          MANIFEST_PUBLIC_KEY: ${{ steps.candidate.outputs.public_key }}
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
          QUALIFICATION_CLIENT_SOURCE: ${{ steps.candidate.outputs.qualification_client }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RELEASE_MANIFEST_FINGERPRINT:?release manifest verification fingerprint is required}"
          : "${EXPECTED_TEAM_ID:?release Team ID is required}"
          node scripts/release/verify-release.mjs "$MANIFEST" "$MANIFEST_SIGNATURE" "$MANIFEST_PUBLIC_KEY" "$RELEASE_MANIFEST_FINGERPRINT"
          scripts/release/verify-macos-release.sh "$MANIFEST" "$MANIFEST_SIGNATURE" "$MANIFEST_PUBLIC_KEY" "$RELEASE_MANIFEST_FINGERPRINT" "$EXPECTED_TEAM_ID"
          test -s "$PRODUCT_PKG"
          bash native/macos/scripts/verify-installed-qualification-client.sh "$QUALIFICATION_CLIENT_SOURCE" "$EXPECTED_TEAM_ID" "$AGENTPASS_APP_IDENTIFIER_PREFIX"

      - name: Verify root-owned qualification config tool matches the trusted workflow commit
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          const root = '/opt/agentpass/p0c/qualification-tool';
          if (process.env.QUALIFICATION_CONFIG_TOOL_ROOT !== root) throw new Error('qualification tool root is not fixed');
          const expected = [
            ['generate-release-attestation.mjs', 'scripts/release/generate-release-attestation.mjs'],
            ['n3e/controller-candidate-contract.mjs', 'scripts/release/n3e/controller-candidate-contract.mjs'],
            ['n3e/controller-identity-contract.mjs', 'scripts/release/n3e/controller-identity-contract.mjs'],
            ['n3e/materialize-controller-candidate.mjs', 'scripts/release/n3e/materialize-controller-candidate.mjs'],
            ['n3e/materialize-qualification-activation.mjs', 'scripts/release/n3e/materialize-qualification-activation.mjs'],
            ['n3e/provision-qualification-config.mjs', 'scripts/release/n3e/provision-qualification-config.mjs'],
            ['n3e/qualification-activation-contract.mjs', 'scripts/release/n3e/qualification-activation-contract.mjs'],
            ['n3e/qualification-canonical-json.mjs', 'scripts/release/n3e/qualification-canonical-json.mjs'],
            ['n3e/qualification-device-relay.mjs', 'scripts/release/n3e/qualification-device-relay.mjs'],
            ['n3e/qualification-input-materializer.mjs', 'scripts/release/n3e/qualification-input-materializer.mjs'],
            ['n3e/qualification-release-materializer.mjs', 'scripts/release/n3e/qualification-release-materializer.mjs'],
            ['n3e/qualification-release-trust.mjs', 'scripts/release/n3e/qualification-release-trust.mjs'],
            ['n3e/qualification-run-binding.mjs', 'scripts/release/n3e/qualification-run-binding.mjs'],
            ['n3e/qualification-scenario-driver.mjs', 'scripts/release/n3e/qualification-scenario-driver.mjs'],
            ['n3e/qualification-suite-evidence.mjs', 'scripts/release/n3e/qualification-suite-evidence.mjs'],
            ['n3e/qualification-suite-input.mjs', 'scripts/release/n3e/qualification-suite-input.mjs'],
            ['n3e/qualification-suite-orchestrator.mjs', 'scripts/release/n3e/qualification-suite-orchestrator.mjs'],
            ['n3e/qualification-unarmed-control.mjs', 'scripts/release/n3e/qualification-unarmed-control.mjs'],
            ['n3e/run-fixed-protected-qualification.mjs', 'scripts/release/n3e/run-fixed-protected-qualification.mjs'],
            ['n3e/run-protected-qualification.mjs', 'scripts/release/n3e/run-protected-qualification.mjs'],
            ['p0c/lib/candidate-checkpoint.mjs', 'scripts/release/p0c/lib/candidate-checkpoint.mjs']
          ];
          const safe = (file, directory = false) => {
            const stat = fs.lstatSync(file);
            if (stat.isSymbolicLink() || stat.uid !== 0 || (stat.mode & 0o022) !== 0 || (directory ? !stat.isDirectory() : !stat.isFile() || stat.nlink !== 1)) throw new Error('qualification tool installation is unsafe');
          };
          safe(root, true); safe(path.join(root, 'n3e'), true);
          const manifestPath = path.join(root, 'manifest.json'); safe(manifestPath);
          const manifestBytes = fs.readFileSync(manifestPath); const manifest = JSON.parse(manifestBytes);
          if (JSON.stringify(Object.keys(manifest).sort()) !== JSON.stringify(['files', 'schema_version']) || manifest.schema_version !== 1 || !Array.isArray(manifest.files) || manifest.files.length !== expected.length) throw new Error('qualification tool manifest is invalid');
          for (let index = 0; index < expected.length; index += 1) {
            const [installedName, sourceName] = expected[index]; const item = manifest.files[index];
            if (JSON.stringify(Object.keys(item).sort()) !== JSON.stringify(['path', 'sha256']) || item.path !== installedName || !/^[0-9a-f]{64}$/.test(item.sha256)) throw new Error('qualification tool manifest binding is invalid');
            const installed = path.join(root, installedName); safe(installed);
            const digest = (file) => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (digest(installed) !== item.sha256 || digest(sourceName) !== item.sha256) throw new Error('protected qualification tool is stale or substituted');
          }
          NODE

      - name: Generate immutable hardware report template from signed release evidence
        env:
          TEMPLATE_OUT: ${{ steps.paths.outputs.output_dir }}/template.json
          BROWSER_VERSIONS_PATH: ${{ steps.paths.outputs.output_dir }}/browser-versions.json
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MANIFEST_SIGNATURE: ${{ steps.candidate.outputs.signature }}
          MANIFEST_PUBLIC_KEY: ${{ steps.candidate.outputs.public_key }}
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          : "${BROWSER_VERSIONS_JSON:?protected browser version inventory is required}"
          node --input-type=module - "$BROWSER_VERSIONS_PATH" <<'NODE'
          import fs from 'node:fs';
          const path = process.argv[2];
          const bytes = Buffer.from(process.env.BROWSER_VERSIONS_JSON, 'utf8');
          const fd = fs.openSync(path, fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW, 0o600);
          try { fs.writeSync(fd, bytes); fs.fsyncSync(fd); } finally { fs.closeSync(fd); }
          NODE
          node scripts/release/generate-hardware-qualification-template.mjs \
            --release-manifest "$MANIFEST" --release-signature "$MANIFEST_SIGNATURE" \
            --release-public-key "$MANIFEST_PUBLIC_KEY" --release-fingerprint "$RELEASE_MANIFEST_FINGERPRINT" \
            --artifact "$PRODUCT_PKG" --operator "$OPERATOR_ID" \
            --operator-key-fingerprint "$OPERATOR_FINGERPRINT" --browser-versions "$BROWSER_VERSIONS_PATH" \
            --output "$TEMPLATE_OUT"

      - name: Materialize lane operator key in private temporary storage
        env:
          PRIVATE_KEY_PATH: ${{ steps.paths.outputs.output_dir }}/operator-private.pem
          PUBLIC_KEY_PATH: ${{ steps.paths.outputs.output_dir }}/operator-public.pem
        shell: bash
        run: |
          set -euo pipefail
          : "${OPERATOR_PRIVATE_KEY_B64:?lane operator private key is required}"
          : "${OPERATOR_PUBLIC_KEY_B64:?lane operator public key is required}"
          : "${OPERATOR_FINGERPRINT:?lane operator fingerprint is required}"
          umask 077
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const write = (path, value, mode) => fs.writeFileSync(path, Buffer.from(value, 'base64'), { flag: 'wx', mode });
          write(process.env.PRIVATE_KEY_PATH, process.env.OPERATOR_PRIVATE_KEY_B64, 0o600);
          write(process.env.PUBLIC_KEY_PATH, process.env.OPERATOR_PUBLIC_KEY_B64, 0o644);
          NODE

      - name: Run fixed root-owned P0-C gate drivers
        env:
          TEMPLATE: ${{ steps.paths.outputs.output_dir }}/template.json
          REPORT: ${{ steps.paths.outputs.output_dir }}/report.json
          EVIDENCE_DIR: ${{ steps.paths.outputs.output_dir }}/evidence
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          /bin/mkdir -m 0700 "$EVIDENCE_DIR"
          node scripts/release/run-p0c-qualification.mjs --template "$TEMPLATE" --output "$REPORT" --artifact "$PRODUCT_PKG" --gate-drivers "$GATE_DRIVER_DIR" --evidence-dir "$EVIDENCE_DIR" --operator "$OPERATOR_ID"

      - name: Run protected N3-E unarmed and six-scenario suite
        env:
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MANIFEST_SIGNATURE: ${{ steps.candidate.outputs.signature }}
          MANIFEST_PUBLIC_KEY: ${{ steps.candidate.outputs.public_key }}
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          : "${QUALIFICATION_DEVICE_CLIENT_CONFIG_B64:?protected qualification device client config is required}"
          : "${QUALIFICATION_RELAY_REQUEST_B64:?protected qualification relay request is required}"
          recover_n3e() {
            sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-device-relay.mjs recover
            sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-suite-orchestrator.mjs recover
            sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-release-materializer.mjs recover
          }
          trap recover_n3e EXIT
          sudo -n --preserve-env=QUALIFICATION_DEVICE_CLIENT_CONFIG_B64,QUALIFICATION_RELAY_REQUEST_B64 /usr/bin/node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = '/private/var/db/agentpass-qualification';
          const expected = fs.lstatSync(root);
          if (!expected.isDirectory() || expected.isSymbolicLink() || expected.uid !== 0 || expected.gid !== 0 || (expected.mode & 0o777) !== 0o700) throw new Error('qualification state directory is not root:wheel 0700');
          const decode = (value, maximum, label) => {
            if (typeof value !== 'string' || value.length === 0 || value.length > Math.ceil(maximum * 4 / 3) + 4 || !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(value)) throw new Error(`${label} is not strict base64`);
            const bytes = Buffer.from(value, 'base64');
            if (bytes.length === 0 || bytes.length > maximum || bytes.toString('base64') !== value) throw new Error(`${label} exceeds its bounded base64 contract`);
            return bytes;
          };
          const writeProtected = (name, value, maximum) => {
            const file = path.join(root, name);
            const bytes = decode(value, maximum, name);
            let fd;
            try {
              fd = fs.openSync(file, fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW, 0o600);
              fs.writeFileSync(fd, bytes); fs.fsyncSync(fd); fs.fchmodSync(fd, 0o600); fs.fchownSync(fd, 0, 0);
            } finally { if (fd !== undefined) fs.closeSync(fd); }
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.uid !== 0 || stat.gid !== 0 || stat.nlink !== 1 || (stat.mode & 0o777) !== 0o600) throw new Error(`${name} was not materialized with its protected inventory contract`);
          };
          writeProtected('device-client-config.json', process.env.QUALIFICATION_DEVICE_CLIENT_CONFIG_B64, 16 * 1024);
          writeProtected('relay-request.json', process.env.QUALIFICATION_RELAY_REQUEST_B64, 32 * 1024);
          NODE
          sudo -n /usr/bin/test -f /private/var/db/agentpass-qualification/candidate-checkpoint.json
          sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-release-materializer.mjs materialize "$CANDIDATE_DIR" "$MANIFEST" "$MANIFEST_SIGNATURE" "$MANIFEST_PUBLIC_KEY" "$RELEASE_MANIFEST_FINGERPRINT" "$PRODUCT_PKG"
          sudo -n /usr/bin/test -f /private/var/db/agentpass-qualification/release-trust.json
          sudo -n /usr/bin/test ! -e /private/var/db/agentpass-qualification/device-response.json
          sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-device-relay.mjs claim
          sudo -n /usr/bin/test ! -e /private/var/db/agentpass-qualification/relay-request.json
          sudo -n /usr/bin/test ! -e /private/var/db/agentpass-qualification/device-response.json
          sudo -n /usr/bin/test -f /private/var/db/agentpass-qualification/input.inbox.json
          sudo -n /usr/bin/test ! -e /private/var/db/agentpass-qualification/input.json
          sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-input-materializer.mjs materialize
          sudo -n /usr/bin/node /opt/agentpass/p0c/qualification-tool/n3e/qualification-suite-orchestrator.mjs run
          recover_n3e
          trap - EXIT

      - name: Sign and independently verify lane report
        env:
          REPORT: ${{ steps.paths.outputs.output_dir }}/report.json
          SIGNATURE: ${{ steps.paths.outputs.output_dir }}/report.sig
          PUBLIC_KEY: ${{ steps.paths.outputs.output_dir }}/operator-public.pem
          PRIVATE_KEY: ${{ steps.paths.outputs.output_dir }}/operator-private.pem
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MANIFEST_SIGNATURE: ${{ steps.candidate.outputs.signature }}
          MANIFEST_PUBLIC_KEY: ${{ steps.candidate.outputs.public_key }}
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
          EVIDENCE_DIR: ${{ steps.paths.outputs.output_dir }}/evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/sign-hardware-qualification.mjs --report "$REPORT" --private-key "$PRIVATE_KEY" --signature "$SIGNATURE" --public-key "$PUBLIC_KEY" --expected-fingerprint "$OPERATOR_FINGERPRINT"
          node scripts/release/validate-hardware-qualification.mjs "$REPORT" "$PRODUCT_PKG" "$MANIFEST" "$MANIFEST_SIGNATURE" "$MANIFEST_PUBLIC_KEY" "$RELEASE_MANIFEST_FINGERPRINT" "$SIGNATURE" "$PUBLIC_KEY" "$OPERATOR_FINGERPRINT" "$EVIDENCE_DIR"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0c-hardware-intel-t2
          path: |
            ${{ steps.paths.outputs.output_dir }}/report.json
            ${{ steps.paths.outputs.output_dir }}/report.sig
            ${{ steps.paths.outputs.output_dir }}/operator-public.pem
            ${{ steps.paths.outputs.output_dir }}/evidence/**
          if-no-files-found: error
          retention-days: 14

      - name: Remove private operator key
        if: ${{ always() }}
        env:
          PRIVATE_KEY_PATH: ${{ steps.paths.outputs.output_dir }}/operator-private.pem
        shell: bash
        run: |
          set +e
          [[ -n "$PRIVATE_KEY_PATH" && "$PRIVATE_KEY_PATH" == "$RUNNER_TEMP"/agentpass-p0c-output-*/operator-private.pem ]] || exit 0
          chmod 000 "$PRIVATE_KEY_PATH" 2>/dev/null
          rm -f -- "$PRIVATE_KEY_PATH"

  aggregate-qualification:
    if: ${{ needs.validate-candidate.result == 'success' && needs.apple-silicon-qualification.result == 'success' && needs.intel-t2-qualification.result == 'success' && github.event_name == 'workflow_dispatch' && github.repository == 'Torutesu/AIagentpass' && github.ref == 'refs/heads/main' }}
    needs: [validate-candidate, apple-silicon-qualification, intel-t2-qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      CANDIDATE_RUN_ID: ${{ needs.validate-candidate.outputs.run_id }}
      CANDIDATE_ARTIFACT_NAME: ${{ needs.validate-candidate.outputs.artifact_name }}
      RELEASE_MANIFEST_FINGERPRINT: ${{ vars.AGENTPASS_RELEASE_MANIFEST_KEY_FINGERPRINT }}
      APPLE_OPERATOR_FINGERPRINT: ${{ vars.AGENTPASS_P0C_APPLE_SILICON_OPERATOR_FINGERPRINT }}
      INTEL_OPERATOR_FINGERPRINT: ${{ vars.AGENTPASS_P0C_INTEL_T2_OPERATOR_FINGERPRINT }}
      APPROVED_OPERATOR_POLICY_JSON: ${{ vars.AGENTPASS_P0C_APPROVED_OPERATOR_POLICY_JSON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - id: paths
        name: Create clean aggregate directories
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_DIR="$RUNNER_TEMP/agentpass-p0c-aggregate-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          APPLE_DIR="$RUNNER_TEMP/agentpass-p0c-aggregate-apple-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          INTEL_DIR="$RUNNER_TEMP/agentpass-p0c-aggregate-intel-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          OUTPUT_DIR="$RUNNER_TEMP/agentpass-p0c-aggregate-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ ! -e "$CANDIDATE_DIR" && ! -e "$APPLE_DIR" && ! -e "$INTEL_DIR" && ! -e "$OUTPUT_DIR" ]] || { echo "aggregate temporary paths already exist" >&2; exit 1; }
          /bin/mkdir -m 0700 "$CANDIDATE_DIR" "$APPLE_DIR" "$INTEL_DIR" "$OUTPUT_DIR"
          printf 'candidate_dir=%s\napple_dir=%s\nintel_dir=%s\noutput_dir=%s\n' "$CANDIDATE_DIR" "$APPLE_DIR" "$INTEL_DIR" "$OUTPUT_DIR" >> "$GITHUB_OUTPUT"
          printf 'CANDIDATE_DIR=%s\nAPPLE_DIR=%s\nINTEL_DIR=%s\nOUTPUT_DIR=%s\n' "$CANDIDATE_DIR" "$APPLE_DIR" "$INTEL_DIR" "$OUTPUT_DIR" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.validate-candidate.outputs.artifact_name }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ steps.paths.outputs.candidate_dir }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p0c-hardware-apple-silicon
          path: ${{ steps.paths.outputs.apple_dir }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p0c-hardware-intel-t2
          path: ${{ steps.paths.outputs.intel_dir }}

      - id: candidate
        name: Re-catalog candidate before aggregate verification
        env:
          CANDIDATE_DIR: ${{ steps.paths.outputs.candidate_dir }}
          EXPECTED_TEAM_ID: ${{ vars.AGENTPASS_RELEASE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs'; import path from 'node:path';
          import { parseCanonicalExternalQualificationControllerIdentity, validateExternalQualificationControllerIdentity } from './scripts/release/n3e/controller-identity-contract.mjs';
          const dir = path.resolve(process.env.CANDIDATE_DIR); const names = fs.readdirSync(dir, { withFileTypes: true });
          for (const item of names) { if (item.isSymbolicLink() || !item.isFile() || !/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(item.name)) throw new Error('aggregate candidate contains an unsafe entry'); }
          const one = (test, label) => { const found = names.filter((item) => test(item.name)); if (found.length !== 1) throw new Error(`aggregate candidate requires exactly one ${label}`); return path.join(dir, found[0].name); };
          const manifest = one((name) => name.endsWith('.release-manifest.json'), 'release manifest'); const signature = one((name) => name.endsWith('.release-manifest.sig'), 'release signature'); const pkg = one((name) => name.endsWith('-macos-universal.pkg'), 'universal PKG');
          const manifestValue = JSON.parse(fs.readFileSync(manifest, 'utf8'));
          if (manifestValue.schema_version !== 4) throw new Error('aggregate candidate release manifest must be v4');
          const external = manifestValue.external_qualification_controller;
          if (!external || JSON.stringify(Object.keys(external).sort()) !== JSON.stringify(['identity', 'identity_document', 'notarization'])) throw new Error('aggregate candidate external controller binding is not exact');
          const identityDocument = external.identity_document;
          const identityPath = path.join(dir, identityDocument?.name ?? '');
          if (!identityDocument || JSON.stringify(Object.keys(identityDocument).sort()) !== JSON.stringify(['bytes', 'name', 'sha256']) || !fs.existsSync(identityPath)) throw new Error('aggregate controller identity document binding is invalid');
          const identityBytes = fs.readFileSync(identityPath);
          if (identityBytes.length !== identityDocument.bytes || crypto.createHash('sha256').update(identityBytes).digest('hex') !== identityDocument.sha256) throw new Error('aggregate controller identity document digest mismatch');
          const identity = parseCanonicalExternalQualificationControllerIdentity(identityBytes);
          if (JSON.stringify(identity) !== JSON.stringify(validateExternalQualificationControllerIdentity(external.identity, { expectedTeamId: process.env.EXPECTED_TEAM_ID }))) throw new Error('aggregate controller identity does not match its document');
          const controllerArtifacts = manifestValue.artifacts?.filter((item) => item.role === 'external_qualification_controller');
          if (controllerArtifacts?.length !== 1 || controllerArtifacts[0].name !== identity.archive_name || !fs.existsSync(path.join(dir, identity.archive_name))) throw new Error('aggregate controller archive role is not exact');
          const controllerArchive = controllerArtifacts[0];
          const controllerBytes = fs.readFileSync(path.join(dir, controllerArchive.name));
          if (controllerArchive.role === 'product' || controllerBytes.length !== controllerArchive.bytes || crypto.createHash('sha256').update(controllerBytes).digest('hex') !== controllerArchive.sha256 || identity.archive_bytes !== controllerArchive.bytes || identity.archive_sha256 !== controllerArchive.sha256) throw new Error('aggregate controller archive digest mismatch');
          const controllerEvidence = external.notarization?.evidence;
          if (!Array.isArray(controllerEvidence) || controllerEvidence.length !== 2 || controllerEvidence.some((item) => !fs.existsSync(path.join(dir, item.name)))) throw new Error('aggregate controller notarization evidence is incomplete');
          for (const item of controllerEvidence) { const bytes = fs.readFileSync(path.join(dir, item.name)); if (bytes.length !== item.bytes || crypto.createHash('sha256').update(bytes).digest('hex') !== item.sha256) throw new Error('aggregate controller notarization evidence digest mismatch'); }
          const product = manifestValue.artifacts?.filter((item) => item.role === 'product');
          const productBytes = fs.readFileSync(pkg);
          if (product?.length !== 1 || product[0].name !== path.basename(pkg) || product[0].bytes !== productBytes.length || product[0].sha256 !== crypto.createHash('sha256').update(productBytes).digest('hex') || manifestValue.candidate_id !== `release-pkg-sha256-v1-${product[0].sha256}`) throw new Error('aggregate candidate_id is not bound to the product PKG digest');
          const expected = new Set([path.basename(manifest), path.basename(signature), path.basename(pkg), 'release-manifest.public.pem', 'SHA256SUMS', 'notarytool-result.json', 'stapler-result.txt', 'release-attestation.json', identityDocument.name, controllerArchive.name, ...controllerEvidence.map((item) => item.name), ...names.filter((item) => item.name.endsWith('.spdx.json') || item.name.endsWith('.database-migration-manifest.json')).map((item) => item.name)]);
          if (names.length !== expected.size || names.some((item) => !expected.has(item.name))) throw new Error('aggregate candidate contains unexpected or missing files');
          const output = process.env.GITHUB_OUTPUT; for (const [key, value] of Object.entries({ manifest, signature, public_key: path.join(dir, 'release-manifest.public.pem'), artifact: pkg })) fs.appendFileSync(output, `${key}=${value}\n`);
          NODE

      - name: Write externally supplied approved operator policy
        env:
          POLICY_PATH: ${{ steps.paths.outputs.output_dir }}/approved-operator-policy.json
        shell: bash
        run: |
          set -euo pipefail
          : "${APPROVED_OPERATOR_POLICY_JSON:?approved operator policy must be supplied as a protected repository variable}"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = process.env.POLICY_PATH;
          const bytes = Buffer.from(process.env.APPROVED_OPERATOR_POLICY_JSON, 'utf8');
          const fd = fs.openSync(path, fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW, 0o600);
          try { fs.writeSync(fd, bytes); fs.fsyncSync(fd); } finally { fs.closeSync(fd); }
          NODE

      - id: aggregate
        name: Verify both signed hardware reports with the external policy
        env:
          MANIFEST: ${{ steps.candidate.outputs.manifest }}
          MANIFEST_SIGNATURE: ${{ steps.candidate.outputs.signature }}
          MANIFEST_PUBLIC_KEY: ${{ steps.candidate.outputs.public_key }}
          PRODUCT_PKG: ${{ steps.candidate.outputs.artifact }}
          POLICY_PATH: ${{ steps.paths.outputs.output_dir }}/approved-operator-policy.json
          APPLE_DIR: ${{ steps.paths.outputs.apple_dir }}
          INTEL_DIR: ${{ steps.paths.outputs.intel_dir }}
          SUMMARY_PATH: ${{ steps.paths.outputs.output_dir }}/qualification-summary.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/verify-hardware-qualification-set.mjs \
            "$MANIFEST" "$MANIFEST_SIGNATURE" "$MANIFEST_PUBLIC_KEY" "$RELEASE_MANIFEST_FINGERPRINT" "$PRODUCT_PKG" \
            "$APPLE_DIR/report.json" "$APPLE_DIR/report.sig" "$APPLE_DIR/operator-public.pem" "$APPLE_OPERATOR_FINGERPRINT" "$APPLE_DIR/evidence" \
            "$INTEL_DIR/report.json" "$INTEL_DIR/report.sig" "$INTEL_DIR/operator-public.pem" "$INTEL_OPERATOR_FINGERPRINT" "$INTEL_DIR/evidence" \
            "$POLICY_PATH" > "$SUMMARY_PATH"
          node --input-type=module - "$SUMMARY_PATH" "$OUTPUT_DIR/qualification-dispatch-binding.json" <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const [summaryPath, outputPath] = process.argv.slice(2);
          if (!/^[1-9][0-9]{0,18}$/.test(process.env.CANDIDATE_RUN_ID || '') || !/^[1-9][0-9]{0,18}$/.test(process.env.GITHUB_RUN_ID || '')) throw new Error('workflow run identity is invalid');
          const summary = fs.readFileSync(summaryPath);
          const binding = {
            schema_version: 1,
            release_run_id: process.env.CANDIDATE_RUN_ID,
            qualification_run_id: process.env.GITHUB_RUN_ID,
            candidate_artifact_name: process.env.CANDIDATE_ARTIFACT_NAME,
            qualification_summary_sha256: crypto.createHash('sha256').update(summary).digest('hex')
          };
          const bytes = Buffer.from(`${JSON.stringify(binding, null, 2)}\n`, 'utf8');
          fs.writeFileSync(outputPath, bytes, { flag: 'wx', mode: 0o600 });
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p0c-hardware-qualification-summary
          path: |
            ${{ steps.paths.outputs.output_dir }}/qualification-summary.json
            ${{ steps.paths.outputs.output_dir }}/qualification-dispatch-binding.json
          if-no-files-found: error
          retention-days: 30

name: Release preflight

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character candidate source SHA"
        required: true
        type: string
      release_tag:
        description: "Exact annotated vX.Y.Z release tag for the candidate source SHA"
        required: true
        type: string
      evidence_path:
        description: "Workspace-relative release evidence JSON"
        required: false
        default: ".release/evidence.json"
        type: string

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate-bound production evidence
        env:
          CANDIDATE_COMMIT_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          EVIDENCE_PATH: ${{ inputs.evidence_path || '.release/evidence.json' }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate source SHA must be a full lowercase SHA-1" >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_COMMIT_SHA" ]] || { echo "preflight checkout is not bound to the candidate source SHA" >&2; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "manual release preflight requires the protected main ref" >&2; exit 1; }
            [[ "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "release_tag must be a canonical version tag" >&2; exit 1; }
            RELEASE_TAG="$RELEASE_TAG_INPUT"
          else
            [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "tag push release preflight requires a version tag" >&2; exit 1; }
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || { echo "release tag is not a canonical version tag" >&2; exit 1; }
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git cat-file -t "$RELEASE_TAG")" == "tag" ]] || { echo "release tag must be annotated" >&2; exit 1; }
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$CANDIDATE_COMMIT_SHA" ]] || { echo "release tag is not bound to the candidate source SHA" >&2; exit 1; }
          node scripts/ops/verify-release-preflight.mjs "$EVIDENCE_PATH" \
            --candidate-commit-sha "$CANDIDATE_COMMIT_SHA"
      - name: Retain verified candidate-bound preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preflight-evidence-${{ inputs.source_sha || github.sha }}
          path: ${{ github.workspace }}/${{ inputs.evidence_path || '.release/evidence.json' }}
          if-no-files-found: error
          retention-days: 14

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: agentpass-integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run real PostgreSQL organization and capability authority E2E
        env:
          AGENTPASS_TEST_DATABASE_URL: postgresql://postgres:agentpass-integration@127.0.0.1:5432/postgres
        run: node --test apps/cloud-api/test/postgres/organization-integration.test.mjs apps/cloud-api/test/postgres/capability-authority-repository.test.mjs apps/cloud-api/test/postgres/human-management-pagination-integration.test.mjs

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix apps/web-console
      - run: npm test --prefix apps/web-console
      - run: npm run lint --prefix apps/web-console
      - run: npm audit --prefix apps/web-console --audit-level=high
      - run: npm run test:native
      - run: npm run test:native-app
      - run: npm run release:validate
      - run: npm run lint

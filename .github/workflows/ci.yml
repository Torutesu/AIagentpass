name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix apps/web-console
      - run: npm test --prefix apps/web-console
      - run: npm run lint --prefix apps/web-console
      - run: npm audit --prefix apps/web-console --audit-level=high
      - run: npm run test:native
      - run: npm run test:native-app
      - run: npm run release:validate
      - run: npm run lint

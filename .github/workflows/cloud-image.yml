name: Cloud API image

on:
  push:
    branches: [main]
    paths:
      - "apps/cloud-api/**"
      - "contracts/**"
      - "lib/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/ops/verify-cloud-deployment.mjs"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/cloud-api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agentpass-cloud-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: true
          sbom: true

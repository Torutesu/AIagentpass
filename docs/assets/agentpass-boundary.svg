<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AgentPass security boundary</title>
  <desc id="desc">An AI coding agent requests a narrowly scoped Git operation from the local AgentPass broker. The private signing key stays inside the macOS protected boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#102840"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#56b4ff"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#69c4ff"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="170" fill="#2b74ff" opacity=".10"/>
  <circle cx="180" cy="560" r="220" fill="#a45bff" opacity=".08"/>
  <text x="70" y="76" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="30" font-weight="700">AgentPass</text>
  <text x="70" y="112" fill="#a9c3da" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18">Permission, not key material.</text>
  <rect x="70" y="178" width="265" height="190" rx="20" fill="#12263a" stroke="#31536f" filter="url(#shadow)"/>
  <text x="100" y="222" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" font-weight="700">AI coding agent</text>
  <text x="100" y="258" fill="#9db8d0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Claude Code · Cursor</text>
  <text x="100" y="300" fill="#69c4ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">git commit</text>
  <text x="100" y="328" fill="#69c4ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">repo / branch / session</text>
  <path d="M350 273h125" stroke="#69c4ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="366" y="252" fill="#9db8d0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">scoped request</text>
  <rect x="485" y="145" width="300" height="255" rx="22" fill="#142d46" stroke="#4b79a0" stroke-width="2" filter="url(#shadow)"/>
  <rect x="515" y="178" width="96" height="28" rx="14" fill="url(#blue)"/>
  <text x="563" y="198" text-anchor="middle" fill="#071323" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" font-weight="700">BROKER</text>
  <text x="515" y="246" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="700">Policy checks</text>
  <text x="515" y="282" fill="#a9c3da" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">repository · branch · remote</text>
  <text x="515" y="311" fill="#a9c3da" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">operation · expiry · revocation</text>
  <path d="M515 345h240" stroke="#385d7c" stroke-width="1"/>
  <text x="515" y="374" fill="#69c4ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">allow → sign</text>
  <path d="M800 273h110" stroke="#69c4ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="806" y="252" fill="#9db8d0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">approved only</text>
  <rect x="920" y="145" width="210" height="255" rx="22" fill="#102c2a" stroke="#3d8f83" stroke-width="2" filter="url(#shadow)"/>
  <text x="950" y="210" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="20" font-weight="700">Protected Mac</text>
  <text x="950" y="250" fill="#a8d5c8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">Secure Enclave</text>
  <text x="950" y="279" fill="#a8d5c8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16">private key</text>
  <path d="M950 323q70-60 140 0v48q-70 60-140 0Z" fill="#1d5b52" stroke="#6ad9b9" stroke-width="2"/>
  <path d="M1018 338v28m-14-14h28" stroke="#b8ffe9" stroke-width="4" stroke-linecap="round"/>
  <rect x="70" y="470" width="1060" height="82" rx="18" fill="#0d1d30" stroke="#23435d"/>
  <text x="100" y="505" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" font-weight="700">The agent receives authority for one operation — never the private key.</text>
  <text x="100" y="533" fill="#9db8d0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15">Early Alpha · macOS + Git SSH signing · test repositories recommended</text>
</svg>
